# AnalyticDB for MySQL MCP Server Configuration
# MCP server for AnalyticDB for MySQL database operations
# Package: https://pypi.org/project/adb-mysql-mcp-server/
# Repository: https://github.com/aliyun/alibabacloud-adb-mysql-mcp-server
# Will build as: ghcr.io/stacklok/dockyard/uvx/adb-mysql-mcp-server:1.0.0

metadata:
  name: adb-mysql-mcp-server
  description: "Official MCP server for AnalyticDB for MySQL of Alibaba Cloud"
  protocol: uvx

spec:
  package: "adb-mysql-mcp-server"
  version: "2.0.0"
  constraints:
    - spec: "mcp<2"
      reason: |
        adb-mysql-mcp-server depends on mcp[cli]>=1.8.0 with no upper bound, but
        mcp 2.0.0 removed the mcp.server.fastmcp module the server imports at
        startup, so the container fails immediately with ModuleNotFoundError.
        Cap it below 2 until upstream pins the dependency themselves.
    - spec: "cryptography>=50.0.0"
      reason: |
        alibabacloud-tea-openapi caps cryptography <49.0.0 for python>=3.9, but
        the fix for GHSA-g6cj-pr64-35w5 (High, Bleichenbacher oracle in PKCS#7
        EnvelopedData decryption) is cryptography 50.0.0. Verified that the
        server's imports and the RSA signing primitive the SDK uses still work
        with 50.0.0.

provenance:
  repository_uri: "https://github.com/aliyun/alibabacloud-adb-mysql-mcp-server"
  repository_ref: "refs/heads/master"

# Security allowlist - none needed, scan shows all tools as SAFE
security:
  allowed_issues: []
