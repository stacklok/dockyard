# Neo4j Cypher MCP Server Configuration
# MCP server for executing Cypher queries against Neo4j databases
# Package: https://pypi.org/project/mcp-neo4j-cypher/
# Repository: https://github.com/neo4j-contrib/mcp-neo4j
# Will build as: ghcr.io/stacklok/dockyard/uvx/mcp-neo4j-cypher:0.3.1

metadata:
  name: mcp-neo4j-cypher
  description: "MCP server for executing Cypher queries against Neo4j databases"
  protocol: uvx

spec:
  package: "mcp-neo4j-cypher"
  version: "0.5.3"

provenance:
  repository_uri: "https://github.com/neo4j-contrib/mcp-neo4j"
  repository_ref: "refs/tags/mcp-neo4j-cypher-v0.3.1"

security:
  # Mock credentials allow tool discovery without a live service.
  mock_env:
    - name: NEO4J_URI
      value: "bolt://127.0.0.1:1"
      description: "Unreachable Neo4j endpoint; tool discovery does not connect - mock value for security scanning"
    - name: NEO4J_USERNAME
      value: "neo4j"
      description: "Neo4j username - mock value for security scanning"
    - name: NEO4J_PASSWORD
      value: "mock-neo4j-password-for-scanning"
      description: "Neo4j password - mock value for security scanning"
