# Neo4j Aura Manager MCP Server Configuration
# MCP server for managing Neo4j Aura cloud instances
# Package: https://pypi.org/project/mcp-neo4j-aura-manager/
# Repository: https://github.com/neo4j-contrib/mcp-neo4j
# Will build as: ghcr.io/stacklok/dockyard/uvx/mcp-neo4j-aura-manager:0.3.0

metadata:
  name: mcp-neo4j-aura-manager
  description: "MCP server for managing Neo4j Aura cloud instances"
  protocol: uvx

spec:
  package: "mcp-neo4j-aura-manager"
  version: "0.4.8"

provenance:
  repository_uri: "https://github.com/neo4j-contrib/mcp-neo4j"
  repository_ref: "refs/tags/mcp-neo4j-aura-manager-v0.3.0"

# Security configuration
security:
  # Mock credentials allow tool discovery without a live service.
  mock_env:
    - name: NEO4J_AURA_CLIENT_ID
      value: "mock-aura-client-id-for-scanning"
      description: "Neo4j Aura client ID - mock value for security scanning"
    - name: NEO4J_AURA_CLIENT_SECRET
      value: "mock-aura-client-secret-for-scanning"
      description: "Neo4j Aura client secret - mock value for security scanning"
