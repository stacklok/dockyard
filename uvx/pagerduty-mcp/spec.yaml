# PagerDuty MCP Server Configuration
# Official MCP server for PagerDuty integration
# Package: https://pypi.org/project/pagerduty-mcp/
# Repository: https://github.com/PagerDuty/pagerduty-mcp-server
# Will build as: ghcr.io/stacklok/dockyard/uvx/pagerduty

metadata:
  name: pagerduty
  description: "MCP server that integrates with PagerDuty to manage incidents, services, schedules, event orchestrations, and more"
  protocol: uvx

spec:
  package: "pagerduty-mcp"
  version: "1.1.0"

provenance:
  repository_uri: "https://github.com/PagerDuty/pagerduty-mcp-server"
  repository_ref: "refs/heads/main"  # Using main branch as the primary development branch

security:
  # Mock env vars allow security scanning without real credentials. pagerduty-mcp
  # v1 creates the PagerDuty client eagerly at startup and raises RuntimeError
  # without an API key, which previously prevented the scanner from connecting
  # to the server at all.
  mock_env:
    - name: PAGERDUTY_USER_API_KEY
      value: "mock-pagerduty-api-key-for-scanning"
      description: "PagerDuty API key — mock value for security scanning"
  allowed_issues:
    - code: "AITech-8.2"
      reason: "Data leak risk acceptable - incident management requires sharing operational data with responders and creating public status updates. Write operations are disabled by default, requiring explicit opt-in with --enable-write-tools flag."
    - code: "AITech-9.1"
      reason: "False positive - YARA rule triggers on 'change event' terminology in tool names (list_change_events, get_change_event, list_service_change_events, list_incident_change_events). These are read-only API calls to retrieve PagerDuty change events for incident correlation, not code execution capabilities. LLM analyzer confirms SAFE."
