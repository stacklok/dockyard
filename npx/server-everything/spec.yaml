# Everything MCP Server Configuration
# Reference and demonstration MCP server exercising all features of the MCP protocol
# Package: https://www.npmjs.com/package/@modelcontextprotocol/server-everything
# Repository: https://github.com/modelcontextprotocol/servers
# Will build as: ghcr.io/stacklok/dockyard/npx/server-everything:2026.1.26

metadata:
  name: server-everything
  description: "Reference and demonstration MCP server exercising all features of the MCP protocol (tools, resources, prompts, sampling, etc.)"
  protocol: npx

spec:
  package: "@modelcontextprotocol/server-everything"
  version: "2026.8.18"

provenance:
  repository_uri: "https://github.com/modelcontextprotocol/servers"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - code: "AITech-12.1"
      tool: "get-env"
      reason: |
        Accepted product risk, not a scanner misfire — this is the official
        MCP reference/demo server, intentionally exposing a `get-env` tool
        that "Prints all environment variables, helpful for debugging MCP
        server configuration" (see the server's own description). Env-var
        inspection genuinely is a data-exposure surface if this container is
        ever run with real secrets in its environment; it is accepted here
        because it is the documented, intended purpose of this test fixture
        for protocol exploration, not because the finding doesn't apply.
    - code: "AITech-8.2"
      tool: "get-env"
      reason: |
        Same underlying tool and same accepted risk as the AITech-12.1 entry
        above (env-var inspection), re-flagged this scan under a different
        taxonomy code by the LLM analyzer rather than because behavior
        changed. Verified the `get-env` implementation is byte-for-byte
        unchanged between v2026.7.4 and v2026.8.18 in
        modelcontextprotocol/servers. Not a new or increased exposure;
        already explicitly accepted under AITech-12.1 in PR #749 for the
        reasons given there.
