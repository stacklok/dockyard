# Astra DB MCP Server Configuration
# MCP server for interacting with DataStax Astra DB
# Package: https://www.npmjs.com/package/@datastax/astra-db-mcp
# Repository: https://github.com/datastax/astra-db-mcp
# Will build as: ghcr.io/stacklok/dockyard/npx/astra-db-mcp:1.2.0

metadata:
  name: astra-db-mcp
  description: "Model Context Protocol server for interacting with DataStax Astra DB"
  protocol: npx

spec:
  package: "@datastax/astra-db-mcp"
  version: "1.3.4"
  overrides:
    - package: "undici"
      version: "6.28.1"
      reason: |
        undici 5.29.0 arrives via astra-db-mcp -> mcp-evals -> @actions/core ->
        @actions/http-client, which caps it at ^5.25.4. The 5.x line is end of
        life, so the fixes only exist in 6.x and later. 6.28.1 is the first
        release that fixes GHSA-rfgv-xxqx-mfg5, GHSA-3wwx-pv8p-q78v and
        GHSA-r53p-7pc4-xj5r, and keeps the earlier fixes for GHSA-vrm6-8vpv-qv8q,
        GHSA-v9p9-hfj2-hcw8 and GHSA-vxpw-j846-p89q. It stays on 6.x to avoid the 7.x
        advisories (GHSA-hm92-r4w5-c3mj, GHSA-vmh5-mc38-953g,
        GHSA-4cwx-7wf7-3272).
        Cross-major force, but @actions/http-client 4.0.1 upstream has itself
        moved to undici ^6.23.0, so 6.x is a supported target for this consumer,
        and the tool list still enumerates.
    - package: "@opentelemetry/sdk-node"
      version: "0.223.0"
      reason: |
        mcp-evals pins @opentelemetry/sdk-node ^0.200.0, which brings in
        @opentelemetry/exporter-prometheus 0.200.0 (GHSA-q7rr-3cgh-j5r3, fixed
        in 0.217.0). 0.217.0 is the minimum fix but its otlp-transformer pins
        protobufjs 8.0.1, which has five high advisories. 0.223.0 drops that
        pin and resolves protobufjs to 7.6.6, which no advisory affects.
    - package: "@opentelemetry/propagator-jaeger"
      version: "2.9.0"
      reason: |
        sdk-node 0.223.0 still resolves propagator-jaeger 2.7.1, which is
        affected by GHSA-45rx-2jwx-cxfr (fixed in 2.9.0).
    - package: "jsondiffpatch"
      version: "0.7.6"
      reason: |
        jsondiffpatch 0.6.0 arrives via mcp-evals -> ai@4.3.19 and is affected
        by GHSA-j4fx-xxwh-2485 (prototype pollution, fixed in 0.7.6).

provenance:
  repository_uri: "https://github.com/datastax/astra-db-mcp"
  repository_ref: "refs/heads/main"

# Security configuration
security:
  # Mock env vars allow security scanning without real credentials
  mock_env:
    - name: ASTRA_DB_APPLICATION_TOKEN
      value: "AstraCS:mock-token-for-scanning:0000000000000000"
      description: "Astra DB token - mock value for security scanning"
    - name: ASTRA_DB_API_ENDPOINT
      value: "https://mock-db-id.apps.astra.datastax.com"
      description: "Astra DB endpoint - mock value for security scanning"
  allowed_issues: []
