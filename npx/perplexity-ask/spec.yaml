# Perplexity Ask MCP Server Configuration
# Real-time web search, reasoning, and research via the Perplexity API
# Package: https://www.npmjs.com/package/@perplexity-ai/mcp-server
# Repository: https://github.com/perplexityai/modelcontextprotocol
# Will build as: ghcr.io/stacklok/dockyard/npx/perplexity-ask:0.9.0

metadata:
  name: perplexity-ask
  description: "Official Perplexity MCP server for real-time web search, reasoning, and research via Sonar models"
  protocol: npx

spec:
  package: "@perplexity-ai/mcp-server"
  version: "1.3.0"

provenance:
  repository_uri: "https://github.com/perplexityai/modelcontextprotocol"
  repository_ref: "refs/heads/main"

security:
  # Mock credentials allow tool discovery without a live service.
  mock_env:
    - name: PERPLEXITY_API_KEY
      value: "mock-perplexity-api-key-for-scanning"
      description: "Perplexity API key - mock value for security scanning"
  allowed_issues:
    - code: "AITech-8.2"
      reason: |
        Accepted data flow - YARA flags perplexity_ask, perplexity_research,
        and perplexity_reason for sending conversation messages to an external
        API. These tools explicitly provide Perplexity-hosted answers, research,
        and reasoning. performAgentResponse maps caller-supplied message roles
        and content into the request input and sends it to the authenticated
        Perplexity Agent API (api.perplexity.ai by default, configurable via
        PERPLEXITY_BASE_URL). This is the advertised service operation, not
        hidden collection of local files or credentials. Users must only pass
        conversation content they intend to share with Perplexity. Verified in
        v1.3.0 (dist/server.js performAgentResponse and makeApiRequest).
