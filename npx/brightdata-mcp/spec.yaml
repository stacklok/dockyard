# Bright Data MCP Server Configuration
# An MCP interface into the Bright Data toolset
# Package: https://www.npmjs.com/package/@brightdata/mcp
# Repository: https://github.com/brightdata/brightdata-mcp
# Will build as: ghcr.io/stacklok/dockyard/npx/brightdata-mcp:4.9.0

metadata:
  name: brightdata-mcp
  description: "An MCP interface into the Bright Data toolset"
  protocol: npx

spec:
  package: "@brightdata/mcp"
  version: "4.9.0"
  overrides:
    - package: "@modelcontextprotocol/sdk"
      version: "1.32.2"
      reason: |
        @brightdata/mcp exact-pins @modelcontextprotocol/sdk 1.21.2, which carries
        GHSA-w48q-cv73-mx4w, GHSA-345p-7cg4-v4c7, GHSA-6qxp-vccf-f47h and several
        advisories fixed only in 1.32.0 (e.g. GHSA-6prh-2h8m-c8cw). fastmcp pulls
        in 1.32.2 transitively, so pinning 1.32.2 clears every advisory without
        downgrading that copy, and stays within the same major version.
    - package: "zod"
      version: "4.6.7"
      reason: |
        @brightdata/mcp depends on zod ^3.24.2, and GHSA-mrhx-c7xc-m3w5 (memory
        exhaustion on oversized constrained collections, High) affects every
        zod release below 4.6.6, so no 3.x fix exists. fastmcp already ships
        zod 4.6.7. Verified that the server enumerates all tools under zod 4 and
        that its single-argument z.record schema still validates. Only side
        effect: zod 4 ignores the search tool's custom errorMap, so unknown-key
        errors use zod's default wording.

provenance:
  repository_uri: "https://github.com/brightdata/brightdata-mcp"
  repository_ref: "refs/heads/main"

# Security allowlist for known acceptable issues
security:
  # A rejected token logs a zone-check error but still allows tool enumeration.
  mock_env:
    - name: API_TOKEN
      value: "dockyard-scan-placeholder"
      description: "Dummy API token for security scanning without real credentials"
  allowed_issues:
    - code: "AITech-12.1"
      reason: |
        LLM analyzer flags scrape_as_markdown and scrape_batch tools with AITech-12.1
        (Tool Poisoning) because their descriptions state they "can unlock any webpage
        even if it uses bot detection or CAPTCHA." This is NOT tool poisoning - it's
        the legitimate core functionality of Bright Data's commercial web scraping
        service. The tools:
        - Call the official Bright Data API (api.brightdata.com)
        - Are read-only (readOnlyHint: true) with no destructive capabilities
        - Transparently document their CAPTCHA/bot-detection bypass capability
        - Use authenticated API tokens for access control
        YARA analysis finds no threats. The "unlock" feature is the product's value
        proposition, not malicious behavior. Verified in v2.8.0.
