# Sentry MCP Server Configuration
# MCP server for Sentry debugging and error tracking operations
# Package: https://www.npmjs.com/package/@sentry/mcp-server
# Repository: https://github.com/getsentry/toolkit
# Will build as: ghcr.io/stacklok/dockyard/npx/sentry-mcp-server:0.17.1

metadata:
  name: sentry-mcp-server
  description: "MCP server for Sentry debugging and error tracking operations"
  protocol: npx

spec:
  package: "@sentry/mcp-server"
  version: "0.42.0"
  overrides:
    - package: "@modelcontextprotocol/sdk"
      version: "1.31.0"
      reason: |
        @sentry/mcp-server 0.42.0 pins @modelcontextprotocol/sdk 1.30.0,
        which is affected by high-severity GHSA-6qxp-vccf-f47h. Version 1.31.0
        contains the upstream fix and is a compatible minor update.

provenance:
  repository_uri: "https://github.com/getsentry/toolkit"
  repository_ref: "refs/heads/main"

# Security allowlist for known false positives
security:
  # Mock credentials allow tool discovery without a live service.
  mock_env:
    - name: SENTRY_ACCESS_TOKEN
      value: "mock-sentry-access-token-for-scanning"
      description: "Sentry access token - mock value for security scanning"
  allowed_issues:
    - code: "AITech-1.1"
      tool: "update_issue"
      reason: |
        False positive - YARA flags the update_issue description's instructions
        to "ignore an issue" and "then ignore it again with the new rule" as
        prompt injection. These describe Sentry's ignored issue status and
        ignore-mode transitions, not instructions to disregard agent policies.
        The handler validates the requested status and ignore options and calls
        the authenticated Sentry issue-update API. Verified in v0.42.0
        (dist/index.js update_issue and buildIgnoreUpdate).
    - code: "AITech-9.1"
      reason: |
        YARA flags the search_docs tool with "command injection" (AISubtech-9.1.4) due to
        pattern matching on terms like "SDK setup", "configuration", and "instrumentation"
        in the tool description. This is a false positive - the tool is a read-only
        documentation search that queries Sentry's docs for SDK setup guides and
        configuration help. LLM analyzer confirms SAFE. No actual injection risk exists
        as the tool only returns documentation snippets. Verified in v0.26.0.
