---
# Octocode MCP Server Configuration
# MCP server for advanced GitHub repository analysis and code discovery
# Package: https://www.npmjs.com/package/octocode-mcp
# Repository: https://github.com/bgauryy/octocode-mcp
# Will build as: ghcr.io/stacklok/dockyard/npx/octocode-mcp:12.0.0

metadata:
  name: octocode-mcp
  description: "MCP server for GitHub repository analysis and code discovery"
  protocol: npx

spec:
  package: "octocode-mcp"
  version: "18.2.2"
  overrides:
    - package: "minimatch"
      version: "10.2.6"
      reason: |
        octocode-engine pulls bash-language-server -> editorconfig -> minimatch@10.0.1,
        vulnerable to ReDoS (GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj,
        GHSA-23c5-xmqv-rm74), fixed in 10.2.3+.
    - package: "protobufjs"
      version: "8.7.1"
      reason: |
        octocode-engine pulls intelephense -> protobufjs@8.3.0, vulnerable to
        DoS/prototype-pollution issues (GHSA-94rc-8x27-4472, GHSA-wcpc-wj8m-hjx6,
        GHSA-f38q-mgvj-vph7, GHSA-jfj6-75fj-8934, GHSA-j3f2-48v5-ccww), fixed in 8.6.6+.

provenance:
  # Monorepo with multiple packages; npm versions don't match git tags
  repository_uri: "https://github.com/bgauryy/octocode-mcp"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - code: "AITech-8.2"
      reason: |
        Flagged on localSearchCode and localFindDeadCode, both read-only local
        file search/analysis tools that return results to the calling agent.
        This is the same allowlisted finding carried forward from v16.0.0 (see
        PR #776), where the equivalent tools (ghSearchCode, localViewStructure)
        tripped the same YARA heuristic on caching/cloning/structured-output
        phrasing without a new data path. Verified directly against the
        @octocodeai/octocode-tools-core v18.0.1 source: localSearchCode wraps
        ripgrep/AST search over local files, and localFindDeadCode performs
        local static analysis for unused exports. Both operate only on the
        local filesystem the agent already has access to.
    - code: "AITech-1.1"
      reason: |
        Explicit accepted risk, not a misclassification - ghSearchCode is a
        read-only GitHub code-search tool whose entire purpose is to return
        snippets of third-party repository content to the calling agent, so
        the indirect-prompt-injection exposure the scanner flags (an
        attacker-controlled repo containing instruction-like text in matched
        file content) is real and inherent to this class of tool, not a
        false alarm. Accepted because it is unavoidable for any tool that
        surfaces external content and is mitigated the same way as other
        such tools: by treating all tool output as untrusted data, never as
        instructions. Verified this is not a new or worsened exposure: the
        ghSearchCode tool description and JSON schema are byte-for-byte
        identical between v18.0.1, which passed this same scan without this
        finding, and v18.2.2 in this update - no new wording, parameter, or
        data path was introduced. Returned content does pass through
        ContentSanitizer.sanitizeContent (native Rust sanitizer in
        @octocodeai/octocode-engine), which redacts detected secrets before
        reaching the agent, but that does not and cannot filter arbitrary
        natural-language phrasing embedded in third-party code or comments.
        Same structural risk already accepted under AITech-8.2 for this tool
        family (see PR #776).
