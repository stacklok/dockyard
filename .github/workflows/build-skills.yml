name: Build Skill Artifacts

on:
  push:
    branches: [ main ]
    paths:
      - 'skills/**/*.yaml'
      - 'cmd/dockhand/**'
      - 'internal/skills/**'
      - 'scripts/skill-scan/**'
      - '.github/workflows/build-skills.yml'
      - '.github/workflows/trusted-skill-scan.yml'
      - '.github/workflows/skill-scan-report.yml'
      - 'go.mod'
      - 'go.sum'

permissions: {}

# Never cancel a run outright — each push publishes/signs/
# attests artifacts for that specific commit, and cancelling one would
# silently skip its release. queue: max keeps every queued run pending
# instead of just the latest, since the default queue depth of 1 would
# otherwise drop a run sandwiched between two others. GitHub rejects
# queue: max combined with a cancel-in-progress that can resolve to true,
# so this can no longer cancel superseded PR runs the way it used to.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  REGISTRY: ghcr.io

jobs:
  discover-skill-configs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed-configs: ${{ steps.find-configs.outputs.changed-configs }}
      scan-configs: ${{ steps.find-configs.outputs.scan-configs }}
      smoke: ${{ steps.find-configs.outputs.smoke }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find skill configurations to build
        id: find-configs
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Find all skill spec.yaml files
          all_configs=$(find skills -name "spec.yaml" -type f 2>/dev/null | sort)

          if [ -z "$all_configs" ]; then
            echo "No skill configurations found"
            echo "changed-configs=[]" >> $GITHUB_OUTPUT
            echo "scan-configs=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Decide whether a change to core build inputs warrants rebuilding
          # every skill. Only inputs that alter the built artifact do: dockhand
          # source and the skills packaging library. go.mod/go.sum count only
          # when the toolhive modules changed — they drive the OCI packaging
          # (internal/skills, cmd/dockhand), so a bump there can alter every
          # artifact. Unrelated dependency bumps must not rebuild all ~160
          # skills (it floods GHCR and hits its rate limit). Changes to the
          # scan scripts or this workflow do not alter artifacts, so they are
          # handled as a smoke test below rather than a full rebuild.
          # Args: $1 = git diff range, $2 = newline-separated changed files.
          core_rebuild_needed() {
            local range="$1" changed="$2"
            if echo "$changed" | grep -qE "(cmd/dockhand/|internal/skills/)"; then
              return 0
            fi
            if echo "$changed" | grep -qE "^go\.(mod|sum)$"; then
              if git diff "$range" -- go.mod go.sum | grep -qE '^[+-].*stacklok/toolhive'; then
                return 0
              fi
            fi
            return 1
          }

          # Smoke mode: set when the only relevant change is to this workflow
          # or the scan scripts. See the block after the event dispatch below.
          smoke=false

          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${BEFORE_SHA}..HEAD"
          else
            diff_range="$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"
          fi
          changed_files=$(git diff --name-only "$diff_range")
          configs_to_build=""
          configs_to_scan=""

          for config in $all_configs; do
            config_dir=$(dirname "$config")
            if echo "$changed_files" | grep -q "^$config$" || echo "$changed_files" | grep -q "^$config_dir/"; then
              configs_to_build="$configs_to_build$config"$'\n'
              configs_to_scan="$configs_to_scan$config"$'\n'
            fi
          done

          if core_rebuild_needed "$diff_range" "$changed_files"; then
            echo "Core build inputs changed - rebuilding all skill configurations (scan only changed specs)"
            configs_to_build="$all_configs"
          fi

          # If the only relevant change was to this workflow or the scan
          # scripts (no spec changed, no full rebuild triggered), run a single
          # representative skill through the validate-skills and
          # skill-security-scan legs. This exercises the scan/validate
          # toolchain (e.g. a Python or scanner bump) without rebuilding or
          # republishing every skill. build-skill-artifacts is skipped for
          # smoke runs via the `smoke` output.
          # Pull-request smoke coverage lives in the secretless Check Skill
          # Artifacts workflow. A main-only scan-system change must not
          # republish an unrelated representative skill.

          configs_json=$(echo "$configs_to_build" | grep -v '^$' | jq -R -s -c 'split("\n")[:-1]')
          scan_configs_json=$(echo "$configs_to_scan" | grep -v '^$' | jq -R -s -c 'split("\n")[:-1]')
          echo "changed-configs=$configs_json" >> $GITHUB_OUTPUT
          echo "scan-configs=$scan_configs_json" >> $GITHUB_OUTPUT
          echo "smoke=$smoke" >> $GITHUB_OUTPUT
          echo "Skill configurations to build: $configs_json"
          echo "Skill configurations to scan: $scan_configs_json"

  validate-skills:
    needs: discover-skill-configs
    runs-on: ubuntu-latest
    if: ${{ needs.discover-skill-configs.outputs.changed-configs != '[]' }}
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover-skill-configs.outputs.changed-configs) }}
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Build dockhand
        run: go build -o /tmp/dockhand ./cmd/dockhand

      - name: Validate skill
        env:
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          echo "Validating skill: $CONFIG_FILE"
          /tmp/dockhand validate-skill --config "$CONFIG_FILE"

  # A successful trusted scan is the release decision for the exact skill
  # content reviewed on the merged PR. Main reuses that decision instead of
  # asking the nondeterministic LLM analyzers to decide again (#940).
  resolve-pr-scan:
    needs: discover-skill-configs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.discover-skill-configs.outputs.scan-configs != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      pr-number: ${{ steps.resolve.outputs.pr-number }}
      run-attempt: ${{ steps.resolve.outputs.run-attempt }}
      run-id: ${{ steps.resolve.outputs.run-id }}
      fallback: ${{ steps.resolve.outputs.fallback }}
    steps:
      - name: Resolve approved pull-request scan
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_CONFIGS: ${{ needs.discover-skill-configs.outputs.scan-configs }}
        with:
          script: |
            if (context.eventName !== 'push' || context.ref !== 'refs/heads/main') {
              core.info('PR approval lookup is only needed for pushes to main.');
              return;
            }
            if (process.env.SCAN_CONFIGS === '[]') {
              core.info('No skill scans are required for this push.');
              return;
            }

            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );
            const merged = pulls.filter(pr =>
              pr.merged_at &&
              pr.base.ref === 'main' &&
              pr.merge_commit_sha === context.sha
            );
            if (merged.length !== 1) {
              core.setFailed(
                `Expected exactly one merged PR for ${context.sha}, found ${merged.length}; ` +
                'refusing to replace the approved scan with a fresh LLM decision.'
              );
              return;
            }

            const pr = merged[0];
            core.setOutput('head-sha', pr.head.sha);
            core.setOutput('pr-number', String(pr.number));
            const identityName = `trusted-scan-identity-pr-${pr.number}-${pr.head.sha}`;
            const expectedTitle = `Trusted skill scan for PR #${pr.number} at ${pr.head.sha}`;
            const matchingRuns = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'trusted-skill-scan.yml',
                event: 'pull_request_target',
                per_page: 100,
              });
              return runs
                .filter(run => run.display_title === expectedTitle)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            };

            let applicable = await matchingRuns();
            const appearanceDeadline = Date.now() + 2 * 60 * 1000;
            while (applicable.length === 0 && Date.now() < appearanceDeadline) {
              core.info(`No matching trusted scan is visible yet; waiting 15 seconds.`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
              applicable = await matchingRuns();
            }
            if (applicable.length === 0) {
              core.warning(`No trusted PR scan exists for PR #${pr.number}; using the current trusted scanner.`);
              core.setOutput('fallback', 'true');
              return;
            }

            let latest = applicable[0];
            const deadline = Date.now() + 30 * 60 * 1000;
            while (latest.status !== 'completed' && Date.now() < deadline) {
              core.info(`Trusted scan run ${latest.id} is ${latest.status}; waiting 30 seconds.`);
              await new Promise(resolve => setTimeout(resolve, 30_000));
              const refreshed = await matchingRuns();
              if (refreshed.length > 0) {
                applicable = refreshed;
                latest = applicable[0];
              }
            }
            if (latest.status !== 'completed') {
              core.setFailed(
                `Timed out waiting for trusted scan run ${latest.id} for PR #${pr.number}.`
              );
              return;
            }
            if (
              latest.conclusion !== 'success' ||
              latest.event !== 'pull_request_target' ||
              latest.path !== '.github/workflows/trusted-skill-scan.yml'
            ) {
              core.setFailed(
                `Trusted run ${latest.id} has invalid workflow identity or conclusion ${latest.conclusion}.`
              );
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: latest.id,
                per_page: 100,
              },
            );
            if (!artifacts.some(artifact => artifact.name === identityName && !artifact.expired)) {
              core.warning(`Run ${latest.id} has no current ${identityName}; using the current trusted scanner.`);
              core.setOutput('fallback', 'true');
              return;
            }

            core.setOutput('run-attempt', String(latest.run_attempt));
            core.setOutput('run-id', String(latest.id));
            core.setOutput('fallback', 'false');
            core.info(
              `Using trusted scan from PR #${pr.number}, run ${latest.id}, ` +
              `attempt ${latest.run_attempt}.`
            );

  skill-security-scan:
    needs: [discover-skill-configs, resolve-pr-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.discover-skill-configs.outputs.scan-configs != '[]' && needs.resolve-pr-scan.result == 'success' }}
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover-skill-configs.outputs.scan-configs) }}
      fail-fast: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yq
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        id: install-deps
        run: |
          set -euo pipefail
          pyyaml_version=$(sed -nE 's/^pyyaml==([^ ]+).*/\1/p' scripts/skill-scan/requirements.txt)
          test -n "$pyyaml_version"
          python3 -m pip install --disable-pip-version-check "PyYAML==$pyyaml_version"
          scanner_version=$(sed -nE 's/^cisco-ai-skill-scanner==([^ ]+).*/\1/p' scripts/skill-scan/requirements.txt)
          test -n "$scanner_version"
          echo "scanner_version=$scanner_version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata from config
        id: meta
        env:
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          skill_name=$(echo "$CONFIG_FILE" | cut -d'/' -f2)
          echo "skill_name=$skill_name" >> $GITHUB_OUTPUT
          echo "config_file=$CONFIG_FILE" >> $GITHUB_OUTPUT

          repository=$(yq '.spec.repository' "$CONFIG_FILE")
          ref=$(yq '.spec.ref' "$CONFIG_FILE")
          skill_path=$(yq '.spec.path // ""' "$CONFIG_FILE")
          if ! grep -Eq '^[0-9a-fA-F]{40}$' <<< "$ref"; then
            echo "::error title=Unpinned skill source::spec.ref must be a full 40-character commit SHA"
            exit 1
          fi
          echo "repository=$repository" >> $GITHUB_OUTPUT
          echo "ref=$ref" >> $GITHUB_OUTPUT
          echo "skill_path=$skill_path" >> $GITHUB_OUTPUT

      - name: Validate skill source identity
        env:
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          python3 - <<'PY'
          import re
          from pathlib import PurePosixPath
          from urllib.parse import urlsplit
          import os
          import yaml

          with open(os.environ['CONFIG_FILE'], encoding='utf-8') as stream:
              doc = yaml.safe_load(stream) or {}
          spec = doc.get('spec') or {}
          repository = spec.get('repository') or ''
          ref = spec.get('ref') or ''
          path = spec.get('path') or ''
          parsed_repository = urlsplit(repository)
          if (
              parsed_repository.scheme != 'https'
              or not parsed_repository.hostname
              or parsed_repository.username
              or parsed_repository.password
              or any(char.isspace() for char in repository)
          ):
              raise SystemExit('spec.repository must be a public HTTPS URL')
          if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
              raise SystemExit('spec.ref must be a full 40-character commit SHA')
          parsed_path = PurePosixPath(path)
          if path and (
              parsed_path.is_absolute()
              or '..' in parsed_path.parts
              or not re.fullmatch(r'[A-Za-z0-9._/-]+', path)
          ):
              raise SystemExit('spec.path must be a safe repository-relative POSIX path')
          if (doc.get('security') or {}).get('insecure_ignore') is True:
              raise SystemExit('security.insecure_ignore cannot approve a trusted scan')
          PY

      - name: Download trusted pull-request scan
        id: download-approved-scan
        if: needs.resolve-pr-scan.outputs.fallback != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-skill-scan-${{ steps.meta.outputs.skill_name }}
          path: /tmp/approved-skill-scan
          run-id: ${{ needs.resolve-pr-scan.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Verify trusted pull-request scan
        id: verify-approved-scan
        if: needs.resolve-pr-scan.outputs.fallback != 'true'
        env:
          APPROVED_HEAD_SHA: ${{ needs.resolve-pr-scan.outputs.head-sha }}
          APPROVED_PR_NUMBER: ${{ needs.resolve-pr-scan.outputs.pr-number }}
          APPROVED_RUN_ATTEMPT: ${{ needs.resolve-pr-scan.outputs.run-attempt }}
          APPROVED_RUN_ID: ${{ needs.resolve-pr-scan.outputs.run-id }}
          CONFIG_FILE: ${{ matrix.config }}
          LLM_CONSENSUS_RUNS: '3'
          LLM_MODEL: ${{ vars.SKILL_SCANNER_LLM_MODEL }}
          LLM_TEMPERATURE: ${{ contains(vars.SKILL_SCANNER_LLM_MODEL, 'gpt-5') && 'none' || vars.SKILL_SCANNER_LLM_TEMPERATURE }}
          SCANNER_VERSION: ${{ steps.install-deps.outputs.scanner_version }}
          SKILL_NAME: ${{ steps.meta.outputs.skill_name }}
          USE_LLM: ${{ vars.SKILL_SCANNER_USE_LLM || 'true' }}
          REPOSITORY: ${{ steps.meta.outputs.repository }}
          REF: ${{ steps.meta.outputs.ref }}
          SKILL_PATH: ${{ steps.meta.outputs.skill_path }}
        run: |
          set -euo pipefail
          approval=/tmp/approved-skill-scan/scan-approval.json
          approved_scan=/tmp/approved-skill-scan/skill-scan-${SKILL_NAME}.json
          approved_summary=/tmp/approved-skill-scan/scan-summary.json
          approved_version=/tmp/approved-skill-scan/scanner-version.txt

          for required in "$approval" "$approved_scan" "$approved_summary" "$approved_version"; do
            if [ ! -f "$required" ]; then
              echo "::error title=PR scan approval incomplete::Missing ${required}; falling back to the current trusted scanner."
              exit 1
            fi
          done

          export APPROVAL="$approval" APPROVED_SCAN="$approved_scan" APPROVED_SUMMARY="$approved_summary"
          export APPROVED_VERSION="$approved_version"
          WORKFLOW_SHA256=$(sha256sum .github/workflows/trusted-skill-scan.yml | cut -d' ' -f1)
          REQUIREMENTS_SHA256=$(sha256sum scripts/skill-scan/requirements.txt | cut -d' ' -f1)
          RUNNER_SHA256=$(sha256sum scripts/skill-scan/run_scan.py | cut -d' ' -f1)
          EVALUATOR_SHA256=$(sha256sum scripts/skill-scan/process_scan_results.py | cut -d' ' -f1)
          ALLOWLIST_SHA256=$(sha256sum scripts/skill-scan/global_allowed_issues.yaml | cut -d' ' -f1)
          CONFIG_SHA256=$(sha256sum "$CONFIG_FILE" | cut -d' ' -f1)
          export WORKFLOW_SHA256 REQUIREMENTS_SHA256 RUNNER_SHA256
          export EVALUATOR_SHA256 ALLOWLIST_SHA256 CONFIG_SHA256
          python3 - <<'PY'
          import hashlib, json, os

          with open(os.environ['APPROVAL'], encoding='utf-8') as stream:
              approval = json.load(stream)
          identity = approval.get('identity') or {}
          canonical = json.dumps(identity, sort_keys=True, separators=(',', ':')).encode()
          expected = {
              'event': 'pull_request_target',
              'pr_number': os.environ['APPROVED_PR_NUMBER'],
              'head_sha': os.environ['APPROVED_HEAD_SHA'],
              'run_id': os.environ['APPROVED_RUN_ID'],
              'run_attempt': os.environ['APPROVED_RUN_ATTEMPT'],
          }
          for field, value in expected.items():
              if str(approval.get(field)) != value:
                  raise SystemExit(f'approval {field} mismatch')
          checks = {
              'config_file': os.environ['CONFIG_FILE'],
              'config_sha256': os.environ['CONFIG_SHA256'],
              'repository': os.environ['REPOSITORY'],
              'ref': os.environ['REF'].lower(),
              'path': os.environ['SKILL_PATH'],
              'scanner_version': os.environ['SCANNER_VERSION'],
          }
          for field, value in checks.items():
              if str(identity.get(field)) != value:
                  raise SystemExit(f'approval identity {field} mismatch')
          if identity.get('resolved_commit') != os.environ['REF'].lower():
              raise SystemExit('approved resolved commit does not match pinned ref')
          profile = identity.get('scan_profile') or {}
          profile_checks = {
              'use_llm': os.environ['USE_LLM'],
              'model': os.environ['LLM_MODEL'],
              'temperature': os.environ['LLM_TEMPERATURE'],
              'consensus_runs': os.environ['LLM_CONSENSUS_RUNS'],
          }
          trusted_checks = {
              'workflow': os.environ['WORKFLOW_SHA256'],
              'requirements': os.environ['REQUIREMENTS_SHA256'],
              'runner': os.environ['RUNNER_SHA256'],
              'evaluator': os.environ['EVALUATOR_SHA256'],
              'global_allowlist': os.environ['ALLOWLIST_SHA256'],
          }
          if profile != profile_checks:
              raise SystemExit('approved scan profile mismatch')
          if identity.get('trusted_inputs') != trusted_checks:
              raise SystemExit('trusted scan implementation changed after approval')
          if hashlib.sha256(canonical).hexdigest() != approval.get('identity_sha256'):
              raise SystemExit('approval identity digest mismatch')
          for path_key, digest_key in (
              ('APPROVED_SCAN', 'scan_sha256'), ('APPROVED_SUMMARY', 'summary_sha256')
          ):
              with open(os.environ[path_key], 'rb') as stream:
                  actual = hashlib.sha256(stream.read()).hexdigest()
              if actual != approval.get(digest_key):
                  raise SystemExit(f'{path_key} digest mismatch')
          if open(os.environ['APPROVED_VERSION'], encoding='utf-8').read().strip() != os.environ['SCANNER_VERSION']:
              raise SystemExit('approved scanner version mismatch')
          PY

          cp "$approved_scan" "skill-scan-${SKILL_NAME}.json"
          cp "$approved_version" scanner-version.txt
          cp "$approval" scan-approval.json
          echo "Reusing the verified scan approved by PR #${APPROVED_PR_NUMBER} (run ${APPROVED_RUN_ID}, attempt ${APPROVED_RUN_ATTEMPT})."
        continue-on-error: true

      - name: Set up uv for fallback scan
        if: needs.resolve-pr-scan.outputs.fallback == 'true' || steps.verify-approved-scan.outcome != 'success'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install fallback scanner
        if: needs.resolve-pr-scan.outputs.fallback == 'true' || steps.verify-approved-scan.outcome != 'success'
        env:
          EXPECTED_SCANNER_VERSION: ${{ steps.install-deps.outputs.scanner_version }}
        run: |
          set -euo pipefail
          uv pip install --system -r scripts/skill-scan/requirements.txt
          installed=$(uv pip show cisco-ai-skill-scanner | awk '/^Version:/ {print $2}')
          test "$installed" = "$EXPECTED_SCANNER_VERSION"
          skill-scanner --version

      - name: Check out source for fallback scan
        id: fallback-source
        if: needs.resolve-pr-scan.outputs.fallback == 'true' || steps.verify-approved-scan.outcome != 'success'
        env:
          SKILL_REPO: ${{ steps.meta.outputs.repository }}
          SKILL_REF: ${{ steps.meta.outputs.ref }}
          SKILL_PATH: ${{ steps.meta.outputs.skill_path }}
          SKILL_NAME: ${{ steps.meta.outputs.skill_name }}
        run: |
          set -euo pipefail
          workdir="/tmp/skill-scan-${SKILL_NAME}"
          git clone --filter=tree:0 --no-checkout --quiet -- "$SKILL_REPO" "$workdir/repo"
          git -C "$workdir/repo" checkout --detach --quiet "$SKILL_REF"
          test "$(git -C "$workdir/repo" rev-parse HEAD)" = "${SKILL_REF,,}"
          if [ -n "$SKILL_PATH" ]; then
            source_dir="$workdir/repo/$SKILL_PATH"
            tree=$(git -C "$workdir/repo" rev-parse "$SKILL_REF:$SKILL_PATH")
          else
            source_dir="$workdir/repo"
            tree=$(git -C "$workdir/repo" rev-parse "$SKILL_REF^{tree}")
          fi
          test -d "$source_dir"
          test "$(git -C "$workdir/repo" cat-file -t "$tree")" = tree
          if find "$source_dir" -type l -print -quit | grep -q .; then
            echo "::error title=Unsafe upstream skill::Symlinks are not allowed in scanned skill content."
            exit 1
          fi
          echo "source_dir=$source_dir" >> "$GITHUB_OUTPUT"

      - name: Run current trusted scanner
        if: needs.resolve-pr-scan.outputs.fallback == 'true' || steps.verify-approved-scan.outcome != 'success'
        env:
          SKILL_SCANNER_USE_LLM: ${{ vars.SKILL_SCANNER_USE_LLM || 'true' }}
          SKILL_SCANNER_LLM_API_KEY: ${{ secrets.SKILL_SCANNER_LLM_API_KEY }}
          SKILL_SCANNER_LLM_MODEL: ${{ vars.SKILL_SCANNER_LLM_MODEL }}
          SKILL_SCANNER_LLM_TEMPERATURE: ${{ contains(vars.SKILL_SCANNER_LLM_MODEL, 'gpt-5') && 'none' || vars.SKILL_SCANNER_LLM_TEMPERATURE }}
          SKILL_SCANNER_LLM_CONSENSUS_RUNS: '3'
          SOURCE_DIR: ${{ steps.fallback-source.outputs.source_dir }}
          SKILL_NAME: ${{ steps.meta.outputs.skill_name }}
          SCANNER_VERSION: ${{ steps.install-deps.outputs.scanner_version }}
          USE_LLM: ${{ vars.SKILL_SCANNER_USE_LLM || 'true' }}
        run: |
          set -euo pipefail
          scan_output="skill-scan-${SKILL_NAME}.json"
          python3 scripts/skill-scan/run_scan.py \
            --source "$SOURCE_DIR" \
            --output "$scan_output" \
            2> "${scan_output%.json}.stderr"
          if [ -s "${scan_output%.json}.stderr" ]; then
            cat "${scan_output%.json}.stderr"
          fi
          if [ "$USE_LLM" = true ]; then
            jq -e '.analyzers_used | index("llm_analyzer") and index("meta_analyzer")' "$scan_output" >/dev/null
          fi
          printf '%s\n' "$SCANNER_VERSION" > scanner-version.txt
          echo "Used a fresh trusted scan because no current PR approval was available."

      # Always re-evaluate the raw result against the spec on main.
      - name: Evaluate scan results against allowlist
        id: evaluate
        env:
          # Severity threshold for blocking. Findings below this severity are
          # surfaced as warnings but do not fail the job. One of: INFO, LOW,
          # MEDIUM, HIGH, CRITICAL. Tune via PR.
          SKILL_SCANNER_BLOCK_SEVERITY: HIGH
          SKILL_NAME: ${{ steps.meta.outputs.skill_name }}
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          scan_output="skill-scan-${SKILL_NAME}.json"

          # process_scan_results.py exits 1 on unallowlisted findings — that fails the job.
          python3 scripts/skill-scan/process_scan_results.py \
            "$scan_output" \
            "$SKILL_NAME" \
            "$CONFIG_FILE" \
            > scan-summary.json

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-scan-${{ steps.meta.outputs.skill_name }}
          path: |
            skill-scan-${{ steps.meta.outputs.skill_name }}.json
            scan-summary.json
            scanner-version.txt
            scan-approval.json
          retention-days: 30

  build-skill-artifacts:
    needs: [discover-skill-configs, validate-skills, skill-security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Aggregate scan result is intentionally not gated here. A failure in one
    # skill's scan must not block publishing the rest. The per-cell
    # `Pre-flight scan gate` step below preserves the security gate at the
    # individual skill level by reading scan-summary.json from the artifact
    # produced by skill-security-scan (uploaded with `if: always()`).
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.discover-skill-configs.outputs.changed-configs != '[]' && needs.validate-skills.result == 'success' }}
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover-skill-configs.outputs.changed-configs) }}
      fail-fast: false
      # Cap concurrency so a full rebuild (toolhive bump) doesn't fan out to
      # ~160 cells that each push a manifest plus signatures and attestations
      # at once — that bursts past GHCR's manifest write limit (2000/minute)
      # and fails signing/attestation. Only bites when there are more cells
      # than this; single-spec changes are unaffected.
      max-parallel: 20

    permissions:
      contents: read
      packages: write
      id-token: write  # Needed for OIDC token (cosign keyless signing, attestations)
      attestations: write  # Needed for actions/attest-* to publish attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install yq
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata from config
        id: meta
        env:
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          echo "config_file=$CONFIG_FILE" >> $GITHUB_OUTPUT

          skill_name=$(echo "$CONFIG_FILE" | cut -d'/' -f2)
          echo "skill_name=$skill_name" >> $GITHUB_OUTPUT

          version=$(yq '.spec.version' "$CONFIG_FILE" 2>/dev/null || echo "latest")
          echo "version=$version" >> $GITHUB_OUTPUT

          ref=$(yq '.spec.ref' "$CONFIG_FILE" 2>/dev/null || echo "")
          if ! grep -Eq '^[0-9a-fA-F]{40}$' <<< "$ref"; then
            echo "::error title=Unpinned skill source::spec.ref must be a full 40-character commit SHA"
            exit 1
          fi
          echo "ref=$ref" >> $GITHUB_OUTPUT

          repository=$(yq '.spec.repository' "$CONFIG_FILE" 2>/dev/null || echo "")
          echo "repository=$repository" >> $GITHUB_OUTPUT

          skill_path=$(yq '.spec.path // ""' "$CONFIG_FILE" 2>/dev/null || echo "")
          echo "skill_path=$skill_path" >> $GITHUB_OUTPUT

          image_name="${REGISTRY}/${{ github.repository }}/skills/${skill_name}"
          echo "image_name=$image_name" >> $GITHUB_OUTPUT

      # Pull the per-skill security scan artifact early, before we spend time
      # building. `continue-on-error: true` so this step succeeds when the
      # artifact does not exist (i.e. this skill was not in scan-configs for
      # this run); the next step decides whether that is acceptable.
      - name: Download skill security scan results
        id: download-scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: skill-scan-${{ steps.meta.outputs.skill_name }}
          path: /tmp/skill-scan-results
        continue-on-error: true

      # Per-cell scan gate. Replaces the old aggregate
      # `needs.skill-security-scan.result == 'success'` check at the job
      # level so that one skill's scan failure cannot starve out the rest.
      # - If this skill was in scan-configs for this run, require a fresh
      #   scan-summary.json with status in {passed, warning}. Anything else
      #   fails the cell, preserving the security gate per skill.
      # - If this skill was NOT in scan-configs (e.g. go.mod-only push that
      #   rebuilds everything but only re-scans changed specs), proceed on
      #   prior trust: the previous run on main must have been clean for the
      #   pinned ref to land here.
      - name: Pre-flight scan gate
        env:
          CONFIG: ${{ matrix.config }}
          SCAN_CONFIGS: ${{ needs.discover-skill-configs.outputs.scan-configs }}
          SKILL_NAME: ${{ steps.meta.outputs.skill_name }}
        run: |
          set -euo pipefail
          summary=/tmp/skill-scan-results/scan-summary.json

          expected=$(jq -r --arg c "$CONFIG" 'index($c) // "missing"' <<<"$SCAN_CONFIGS")

          if [ ! -f "$summary" ]; then
            if [ "$expected" = "missing" ]; then
              echo "No scan ran for ${SKILL_NAME} in this workflow (not in scan-configs); proceeding on prior trust."
              exit 0
            fi
            echo "::error title=Scan artifact missing::scan-summary.json absent for ${SKILL_NAME} but the skill was in scan-configs; refusing to publish."
            exit 1
          fi

          status=$(jq -r '.status // "missing"' "$summary")
          case "$status" in
            passed|warning)
              echo "Skill scan status for ${SKILL_NAME}: ${status} - publish allowed."
              ;;
            *)
              echo "::error title=Scan blocked publish::Skill ${SKILL_NAME} scan status is '${status}'; refusing to publish."
              jq -r '.blocking_issues[]? | "  - [\(.code)] (\(.severity)) \(.message)"' "$summary" 2>/dev/null || true
              exit 1
              ;;
          esac

      - name: Build dockhand
        run: go build -o /tmp/dockhand ./cmd/dockhand

      - name: Build skill artifact
        id: build
        env:
          CONFIG_FILE: ${{ steps.meta.outputs.config_file }}
          IMAGE_REF: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.version }}
          PUSH: 'true'
        run: |
          # pipefail so a dockhand failure propagates through `tee` and fails
          # the step. Without it, `set -e` alone would not fail on a non-zero
          # left-hand side of the pipeline.
          set -o pipefail

          echo "Building skill artifact for $CONFIG_FILE"

          build_args="--config $CONFIG_FILE --tag $IMAGE_REF"
          if [ "$PUSH" = "true" ]; then
            build_args="$build_args --push"
          fi

          log_file=$(mktemp)

          # Retry dockhand on non-zero exit. Matrix jobs concurrently pushing
          # brand-new GHCR packages regularly hit transient 5xx from the
          # registry (observed "500 unknown: unknown error" on manifest PUT).
          # A linear backoff is enough — a successful retry typically lands
          # within the first extra attempt.
          max_attempts=3
          attempt=1
          while :; do
            echo "=== dockhand build-skill attempt ${attempt}/${max_attempts} ==="
            if /tmp/dockhand build-skill $build_args 2>&1 | tee "$log_file"; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "dockhand build-skill failed after ${attempt} attempt(s)" >&2
              exit 1
            fi
            backoff=$(( 10 * attempt ))
            echo "dockhand build-skill failed; retrying in ${backoff}s..." >&2
            sleep "$backoff"
            attempt=$(( attempt + 1 ))
          done

          # Extract digest from captured output. `|| true` so an absent
          # "Digest:" line yields digest="" without failing the step; downstream
          # steps already gate on `steps.build.outputs.digest != ''`.
          digest=$(grep "^Digest:" "$log_file" | awk '{print $2}' || true)
          echo "digest=$digest" >> $GITHUB_OUTPUT
          rm -f "$log_file"

      - name: Sign skill artifact with Cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "No digest available, skipping signing"
            exit 0
          fi

          # Retry cosign on non-zero exit. During a full rebuild the concurrent
          # matrix cells push signatures fast enough to trip GHCR's manifest
          # rate limit (TOOMANYREQUESTS); the retry-after is tiny, so a short
          # linear backoff clears it. cosign does not retry these itself.
          retry() {
            local max_attempts=5 attempt=1 backoff
            while :; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "cosign failed after ${attempt} attempt(s): $*" >&2
                return 1
              fi
              backoff=$(( 5 * attempt ))
              echo "cosign failed; retrying in ${backoff}s: $*" >&2
              sleep "$backoff"
              attempt=$(( attempt + 1 ))
            done
          }

          echo "Signing skill artifact ${IMAGE_NAME}@${DIGEST}"
          retry cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          retry cosign sign --yes "${IMAGE_NAME}:${VERSION}"
          echo "Signed: ${IMAGE_NAME}@${DIGEST} and ${IMAGE_NAME}:${VERSION}" >> $GITHUB_STEP_SUMMARY

      - name: Check out skill source for SBOM
        if: steps.build.outputs.digest != ''
        id: skill-src
        env:
          SKILL_REPO: ${{ steps.meta.outputs.repository }}
          SKILL_REF: ${{ steps.meta.outputs.ref }}
          SKILL_PATH: ${{ steps.meta.outputs.skill_path }}
        run: |
          rm -rf /tmp/skill-src
          mkdir -p /tmp/skill-src
          git clone --filter=tree:0 --no-checkout "$SKILL_REPO" /tmp/skill-src/repo
          git -C /tmp/skill-src/repo checkout "$SKILL_REF"
          if [ -n "$SKILL_PATH" ]; then
            src_dir="/tmp/skill-src/repo/$SKILL_PATH"
          else
            src_dir="/tmp/skill-src/repo"
          fi
          echo "source_dir=$src_dir" >> $GITHUB_OUTPUT

      - name: Generate SBOM from skill source
        if: steps.build.outputs.digest != ''
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ${{ steps.skill-src.outputs.source_dir }}
          format: spdx-json
          output-file: /tmp/skill-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM for skill artifact
        if: steps.build.outputs.digest != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.meta.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: /tmp/skill-sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance for skill artifact
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create security scan attestation (SCAI format)
        if: steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          CONFIG_FILE: ${{ matrix.config }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Prior-trust path: this skill was not in scan-configs for this run
          # (e.g. go.mod-only push that rebuilds everything but only re-scans
          # changed specs). The previous SCAI attestation on the registry
          # remains authoritative; skipping here is safe and intentional.
          if [ ! -f /tmp/skill-scan-results/scan-summary.json ]; then
            echo "No fresh scan summary for this run; skipping SCAI attestation (skill not in this run's scan-configs)."
            exit 0
          fi

          SCANNER_VERSION=""
          if [ -f /tmp/skill-scan-results/scanner-version.txt ]; then
            SCANNER_VERSION=$(tr -d '\n' < /tmp/skill-scan-results/scanner-version.txt)
            echo "Scanner version: $SCANNER_VERSION"
          fi

          python3 scripts/skill-scan/generate_scai_attestation.py \
            /tmp/skill-scan-results/scan-summary.json \
            "$IMAGE_NAME" \
            "$DIGEST" \
            --config-file "$CONFIG_FILE" \
            --commit-sha "$COMMIT_SHA" \
            --run-id "$RUN_ID" \
            --run-url "${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}" \
            --producer-uri "${SERVER_URL}/${REPO}" \
            --scanner-version "$SCANNER_VERSION" \
            --scanner-uri "https://github.com/cisco-ai-defense/skill-scanner" \
            --validate \
            --output /tmp/skill-scai.json

          echo "Generated SCAI attestation:"
          cat /tmp/skill-scai.json

          # Retry cosign attest against GHCR rate limiting (see the signing
          # step). cosign does not retry TOOMANYREQUESTS itself.
          retry() {
            local max_attempts=5 attempt=1 backoff
            while :; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "cosign attest failed after ${attempt} attempt(s)" >&2
                return 1
              fi
              backoff=$(( 5 * attempt ))
              echo "cosign attest failed; retrying in ${backoff}s..." >&2
              sleep "$backoff"
              attempt=$(( attempt + 1 ))
            done
          }

          retry cosign attest --yes \
            --predicate /tmp/skill-scai.json \
            --type https://in-toto.io/attestation/scai/v0.3 \
            "${IMAGE_NAME}@${DIGEST}"

          ATTRIBUTE=$(python3 -c "import json,sys;print(json.load(open('/tmp/skill-scai.json'))['predicate']['attributes'][0]['attribute'])")
          echo "SCAI security scan attestation created (${ATTRIBUTE})" >> $GITHUB_STEP_SUMMARY
          rm -f /tmp/skill-scai.json

      - name: Build summary
        env:
          SKILL_NAME: ${{ steps.meta.outputs.skill_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_NAME: ${{ steps.meta.outputs.image_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Skill Build: ${SKILL_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Skill | ${SKILL_NAME} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${IMAGE_NAME}:${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$DIGEST" ]; then
            echo "| Digest | \`${DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Status | Published |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$DIGEST" ]; then
            echo "| SBOM | Attested (SPDX) |" >> $GITHUB_STEP_SUMMARY
            echo "| Provenance | Attested (SLSA) |" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    needs: [discover-skill-configs, validate-skills, skill-security-scan, build-skill-artifacts]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Build summary
        env:
          CONFIGS: ${{ needs.discover-skill-configs.outputs.changed-configs }}
          SCAN_CONFIGS: ${{ needs.discover-skill-configs.outputs.scan-configs }}
          VALIDATE_RESULT: ${{ needs.validate-skills.result }}
          SCAN_RESULT: ${{ needs.skill-security-scan.result }}
          BUILD_RESULT: ${{ needs.build-skill-artifacts.result }}
        run: |
          echo "## Skill Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skills to build | $(echo "$CONFIGS" | jq '. | length') |" >> $GITHUB_STEP_SUMMARY
          echo "| Skills to scan | $(echo "$SCAN_CONFIGS" | jq '. | length') |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${VALIDATE_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security scan | ${SCAN_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${BUILD_RESULT} |" >> $GITHUB_STEP_SUMMARY
