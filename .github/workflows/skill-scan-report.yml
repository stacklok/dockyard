# Runs in the base repository context so it can comment on PRs from forks.
# Triggered after Trusted Skill Scan completes; downloads scan artifacts
# and upserts a single "Skill Security Scan Results" PR comment.
#
# `workflow_run` supplies base-repository write access after the trusted scan.
# This workflow never checks out or executes pull-request code.
name: Skill Scan Report

on:
  workflow_run:   # zizmor: ignore[dangerous-triggers]
    workflows: ["Trusted Skill Scan"]
    types: [completed]

permissions: {}

jobs:
  skill-scan-report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request_target'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-pull-requests: write

      - name: Download scan results
        id: scan-results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trusted-skill-scan-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: scan-artifacts
        continue-on-error: true

      - name: Download trusted run identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trusted-scan-context-pr-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: scan-identity

      - name: Comment PR with scan results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const findNamedFiles = (root, name) => {
              const matches = [];
              const visit = current => {
                for (const entry of fs.readdirSync(current, {withFileTypes: true})) {
                  const candidate = path.join(current, entry.name);
                  if (entry.isDirectory()) visit(candidate);
                  else if (entry.isFile() && entry.name === name) matches.push(candidate);
                }
              };
              if (fs.existsSync(root)) visit(root);
              return matches;
            };

            const identityFiles = findNamedFiles('scan-identity', 'trusted-scan-context.json');
            if (identityFiles.length !== 1) {
              core.setFailed(`Expected one trusted run identity, found ${identityFiles.length}.`);
              return;
            }
            const identity = JSON.parse(fs.readFileSync(identityFiles[0], 'utf8'));
            const prNumber = Number.parseInt(identity.pr_number, 10);
            if (!Number.isInteger(prNumber)) return core.setFailed('Invalid PR number in trusted identity.');
            const expectedSkills = Array.isArray(identity.scan_configs)
              ? identity.scan_configs.map(config => config.split('/')[1])
              : [];
            console.log('Commenting on PR:', prNumber);

            let comment = '## 🛡️ Skill Security Scan Results\n\n';
            let hasAnyIssues = false;
            let hasScanErrors = false;
            let totalSkillsScanned = 0;
            let totalBlocking = 0;
            const reportedSkills = new Set();

            const artifactsDir = 'scan-artifacts';
            const summaryFiles = findNamedFiles(artifactsDir, 'scan-summary.json');

            if (summaryFiles.length === 0 && expectedSkills.length === 0) {
              comment += '⚠️ No skills were scanned in this PR.\n';
            }
            for (const file of summaryFiles) {
              try {
                const summary = JSON.parse(fs.readFileSync(file, 'utf8'));
                totalSkillsScanned++;
                const name = summary.skill || 'unknown';
                reportedSkills.add(name);

                if (summary.status === 'passed') {
                  comment += `### ✅ ${name}\n`;
                  comment += `- **Status**: Passed\n`;
                  comment += `- **Findings**: ${summary.findings_count || 0}\n`;
                  if (summary.allowed_issues && summary.allowed_issues.length > 0) {
                    comment += `- **Allowed (not blocking)**: ${summary.allowed_count}\n`;
                    for (const issue of summary.allowed_issues) {
                      comment += `  - \`${issue.code}\` _(Allowed: ${issue.allowed_reason})_\n`;
                    }
                  }
                  comment += '\n';
                } else if (summary.status === 'failed') {
                  hasAnyIssues = true;
                  totalBlocking += summary.blocking_count || 0;
                  comment += `### ❌ ${name}\n`;
                  comment += `- **Status**: Failed\n`;
                  comment += `- **Findings**: ${summary.findings_count || 0}\n`;
                  comment += `- **Blocking**: ${summary.blocking_count || 0}\n\n`;
                  comment += '**Blocking issues:**\n';
                  if (summary.blocking_issues) {
                    for (const issue of summary.blocking_issues) {
                      const loc = issue.file_path
                        ? ` _(${issue.file_path}${issue.line_number ? ':' + issue.line_number : ''})_`
                        : '';
                      comment += `- **[${issue.code}]** (${issue.severity}) ${issue.message}${loc}\n`;
                    }
                  }
                  if (summary.allowed_issues && summary.allowed_issues.length > 0) {
                    comment += '\n**Allowlisted (not blocking):**\n';
                    for (const issue of summary.allowed_issues) {
                      comment += `- \`${issue.code}\` _(Allowed: ${issue.allowed_reason})_\n`;
                    }
                  }
                  comment += '\n';
                } else if (summary.status === 'warning') {
                  comment += `### ⚠️ ${name}\n`;
                  comment += `- **Status**: Warning\n`;
                  comment += `- **Message**: ${summary.message}\n\n`;
                } else {
                  hasScanErrors = true;
                  comment += `### ⚠️ ${name}\n`;
                  comment += `- **Status**: Error\n`;
                  comment += `- **Message**: ${summary.message || 'Unknown error'}\n\n`;
                }
              } catch (error) {
                hasScanErrors = true;
                console.error(`Error parsing ${file}:`, error);
                comment += `### ⚠️ Error parsing scan results\n`;
                comment += `Could not parse ${file}: ${error.message}\n\n`;
              }
            }

            for (const name of expectedSkills.filter(skill => !reportedSkills.has(skill))) {
              hasScanErrors = true;
              comment += `### ⚠️ ${name}\n`;
              comment += '- **Status**: Error\n';
              comment += '- **Message**: The trusted scan did not produce a result summary. Check the failed scan job.\n\n';
            }

            if (totalSkillsScanned > 0 || hasScanErrors) {
              comment += '---\n';
              comment += `**Summary**: Completed ${totalSkillsScanned} of ${expectedSkills.length || totalSkillsScanned} skill scan(s)`;
              if (hasAnyIssues || hasScanErrors) {
                comment += `, found ${totalBlocking} blocking issue(s).\n\n`;
                comment += '⚠️ **Action Required**: Review the failed scan jobs and any blocking findings. Add a justified entry to the skill\'s `security.allowed_issues[]` only when a finding is a confirmed false positive.\n';
              } else {
                comment += ', all passed security checks. ✅\n';
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Skill Security Scan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log(`Updated existing comment #${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
              console.log('Created new comment');
            }
