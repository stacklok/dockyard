# This workflow runs in the context of the base repository and has write access
# to post PR comments, even for PRs from forks. It triggers after the main
# build-containers workflow completes and downloads scan result artifacts.
#
# `workflow_run` is required for that base-repo write access; the trade-off it
# flags is a privileged workflow trusting event data from an untrusted run.
# This workflow never checks out or executes the triggering run's code, and
# the values it takes from it are the PR number (used solely to target a
# comment) and scanner results, which are rendered as escaped literal text.
# A bad PR number can land a comment on the wrong PR, but cannot escalate
# privileges or execute pull-request code.
name: MCP Scan Report

on:
  workflow_run:   # zizmor: ignore[dangerous-triggers]
    workflows: ["Build MCP Server Containers"]
    types: [completed]

permissions: {}

jobs:
  mcp-scan-report:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-pull-requests: write

      - name: Download PR number artifact
        id: pr-number
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Read PR number
        id: read-pr
        run: |
          PR_NUMBER=$(cat pr-number.txt)
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR number: $PR_NUMBER"

      - name: Download scan results
        id: scan-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mcp-scan-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: scan-artifacts
        continue-on-error: true

      - name: Comment PR with scan results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = parseInt('${{ steps.read-pr.outputs.pr_number }}');
            console.log('Commenting on PR:', prNumber);

            let comment = '## 🔒 MCP Security Scan Results\n\n';
            let hasAnyIssues = false;
            let totalServersScanned = 0;
            let totalVulnerabilities = 0;

            // Find all scan summary files in the scan-artifacts directory
            const summaryFiles = [];
            const artifactsDir = 'scan-artifacts';

            if (fs.existsSync(artifactsDir)) {
              const artifactDirs = fs.readdirSync(artifactsDir);
              console.log('Artifact contents:', artifactDirs);

              for (const item of artifactDirs) {
                const itemPath = path.join(artifactsDir, item);
                const stat = fs.statSync(itemPath);

                if (stat.isDirectory()) {
                  const summaryFile = path.join(itemPath, 'scan-summary.json');
                  if (fs.existsSync(summaryFile)) {
                    summaryFiles.push(summaryFile);
                    console.log('Found summary file in directory:', summaryFile);
                  }
                } else if (stat.isFile() && item === 'scan-summary.json') {
                  summaryFiles.push(itemPath);
                  console.log('Found summary file directly:', itemPath);
                }
              }
            }

            console.log('Total summary files found:', summaryFiles.length);

            if (summaryFiles.length === 0) {
              comment += '⚠️ No MCP servers were scanned in this PR.\n';
            } else {
              for (const file of summaryFiles) {
                try {
                  const summary = JSON.parse(fs.readFileSync(file, 'utf8'));
                  totalServersScanned++;

                  if (summary.status === 'passed') {
                    comment += `### ✅ ${summary.server}\n`;
                    comment += `- **Status**: Passed\n`;
                    comment += `- **Tools scanned**: ${summary.tools_scanned || 0}\n`;
                    comment += `- **Result**: No security issues detected\n\n`;
                  } else if (summary.status === 'failed') {
                    hasAnyIssues = true;
                    totalVulnerabilities += summary.blocking_count || 0;
                    comment += `### ❌ ${summary.server}\n`;
                    comment += `- **Status**: Failed\n`;
                    comment += `- **Tools scanned**: ${summary.tools_scanned || 0}\n`;
                    comment += `- **Vulnerabilities found**: ${summary.blocking_count || 0}\n`;
                    comment += '\n**Security issues detected:**\n';

                    if (summary.blocking_issues) {
                      summary.blocking_issues.forEach(vuln => {
                        comment += `- **[${vuln.code}]** ${vuln.message}\n`;
                      });
                    }

                    if (summary.allowed_issues && summary.allowed_issues.length > 0) {
                      comment += '\n**Allowed issues (not blocking):**\n';
                      summary.allowed_issues.forEach(vuln => {
                        comment += `- **[${vuln.code}]** ${vuln.message} _(Allowed: ${vuln.allowed_reason})_\n`;
                      });
                    }
                    comment += '\n';
                  } else if (summary.status === 'warning') {
                    comment += `### ⚠️ ${summary.server}\n`;
                    comment += `- **Status**: Warning\n`;
                    comment += `- **Message**: ${summary.message}\n\n`;
                  } else {
                    comment += `### ⚠️ ${summary.server}\n`;
                    comment += `- **Status**: Error\n`;
                    comment += `- **Message**: ${summary.message || 'Unknown error'}\n\n`;
                  }
                } catch (error) {
                  console.error(`Error parsing ${file}:`, error);
                  comment += `### ⚠️ Error parsing scan results\n`;
                  comment += `Could not parse ${file}: ${error.message}\n\n`;
                }
              }

              if (totalServersScanned > 0) {
                comment += '---\n';
                comment += `**Summary**: Scanned ${totalServersScanned} MCP server(s)`;
                if (hasAnyIssues) {
                  comment += `, found ${totalVulnerabilities} security issue(s).\n\n`;
                  comment += '⚠️ **Action Required**: Security issues were detected. Please review and address them before merging.\n';
                } else {
                  comment += ', all passed security checks. ✅\n';
                }
              }
            }

            // Find and update or create comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('MCP Security Scan Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log(`Updated existing comment #${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: comment
              });
              console.log('Created new comment');
            }

      # This artifact is produced before the Grype enforcement step fails a
      # build matrix cell, so completed failed runs can still report the
      # packages that need review on the pull request.
      - name: Download Grype results
        id: grype-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: grype-scan-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: grype-artifacts
        continue-on-error: true

      - name: Comment PR with Grype results
        if: steps.grype-results.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.read-pr.outputs.pr_number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const title = '## 🛡️ Grype Vulnerability Scan Results';
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const artifactsDir = 'grype-artifacts';

            // Scanner output comes from a pull-request build. Keep every
            // value literal so it cannot inject Markdown into this comment.
            const code = value => `<code>${String(value ?? '')
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/\|/g, '&#124;')
              .replace(/[\r\n]/g, ' ')}</code>`;
            const scanFiles = [];
            const collectJsonFiles = directory => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const entryPath = path.join(directory, entry.name);
                if (entry.isDirectory()) collectJsonFiles(entryPath);
                else if (entry.isFile() && entry.name.endsWith('.json')) scanFiles.push(entryPath);
              }
            };

            if (fs.existsSync(artifactsDir)) collectJsonFiles(artifactsDir);

            const servers = [];
            for (const file of scanFiles) {
              const server = path.basename(path.dirname(file)).replace(/^grype-scan-/, '');
              try {
                const results = JSON.parse(fs.readFileSync(file, 'utf8'));
                const findings = (results.matches || []).filter(match =>
                  ['Critical', 'High'].includes(match?.vulnerability?.severity) &&
                  (match.vulnerability.fix?.versions || []).length > 0
                );
                servers.push({ server, findings });
              } catch (error) {
                console.error(`Could not parse ${file}: ${error.message}`);
                servers.push({ server, error: 'The Grype result artifact could not be parsed.' });
              }
            }

            let body = `${title}\n\n`;
            if (servers.length === 0) {
              body += '⚠️ No Grype result artifacts were available for this run.\n';
            } else {
              const total = servers.reduce((count, server) => count + (server.findings?.length || 0), 0);
              if (total === 0) {
                body += '✅ No fixable High or Critical vulnerabilities found.\n';
              } else {
                body += 'Fixable High and Critical findings block publishing. Review these package versions when evaluating an override.\n\n';
              }

              for (const server of servers.sort((left, right) => left.server.localeCompare(right.server))) {
                body += `### ${code(server.server)}\n`;
                if (server.error) {
                  body += `⚠️ ${server.error}\n\n`;
                  continue;
                }
                if (server.findings.length === 0) {
                  body += '✅ No blocking findings.\n\n';
                  continue;
                }
                body += '| Severity | Vulnerability | Package | Installed | Available fix |\n';
                body += '| --- | --- | --- | --- | --- |\n';
                for (const finding of server.findings) {
                  const fix = finding.vulnerability.fix.versions.join(', ');
                  body += `| ${finding.vulnerability.severity} | ${code(finding.vulnerability.id)} | ${code(finding.artifact.name)} | ${code(finding.artifact.version)} | ${code(fix)} |\n`;
                }
                body += '\n';
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
            });
            const existing = comments.find(comment => comment.user.type === 'Bot' && comment.body.startsWith(title));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
              console.log(`Updated Grype result comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
              console.log('Created Grype result comment');
            }

      - name: Download override check results
        id: override-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: override-check-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: override-check-results
        continue-on-error: true

      # Informational only. Posts a separate sticky comment when a changed spec
      # carries npx overrides, and keeps the `override-downgrade` label in sync.
      - name: Comment PR with override check results
        if: steps.override-results.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.read-pr.outputs.pr_number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const dir = 'override-check-results';
            const title = '## Dependency Override Check';
            const label = 'override-downgrade';

            const summaries = fs.readdirSync(dir)
              .filter(f => f.endsWith('.json'))
              .map(f => JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')));
            if (summaries.length === 0) {
              console.log('No override-bearing specs changed; nothing to comment');
              return;
            }

            const flagged = summaries.filter(s => s.status === 'downgrade');
            let body = `${title}\n\n`;
            body += 'npm `overrides` are exact, tree-global pins. This resolves each changed spec ' +
              'without its overrides and compares. A pin below the highest version otherwise ' +
              'present silently downgrades that copy. Informational only; the Grype scan is the hard gate.\n\n';

            for (const s of summaries) {
              const icon = s.status === 'ok' ? '✅' : '⚠️';
              body += `### ${icon} ${s.server}\n`;
              if (s.status === 'error') {
                body += `Could not resolve the dependency tree:\n\n\`\`\`\n${s.message}\n\`\`\`\n\n`;
                continue;
              }
              for (const o of s.overrides) {
                const found = o.versions.length ? o.versions.map(v => `\`${v}\``).join(', ') : 'not in tree';
                let note = '';
                if (o.downgrade) {
                  note = ` **Lowers** ${o.lowers.map(v => `\`${v}\``).join(', ')}` +
                    (o.raises.length ? `; raises ${o.raises.map(v => `\`${v}\``).join(', ')}` : '') + '.';
                } else if (o.absent) {
                  note = ' Package is no longer in the tree; the override may be removable.';
                }
                body += `- \`${o.package}\` pinned \`${o.pin}\`; without override: ${found}.${note}\n`;
              }
              body += '\n';
            }
            if (flagged.length) {
              body += '---\nA downgrade can be intentional (for example, pinning the last patched ' +
                'release of an older major). If so, make sure the override `reason` says why; ' +
                'otherwise re-evaluate the pin.\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(title));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
            }

            // Keep the label in sync with the latest result.
            if (flagged.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: [label],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber, name: label,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
