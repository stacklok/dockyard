name: Periodic Container Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2am UTC
  workflow_dispatch:  # Allow manual trigger

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  discover-published-images:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      configs: ${{ steps.find-configs.outputs.configs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find all configuration files
        id: find-configs
        run: |
          # Find all spec.yaml files - scan all published images
          all_configs=$(find npx uvx go -name "spec.yaml" -type f 2>/dev/null | sort)
          configs_json=$(echo "$all_configs" | jq -R -s -c 'split("\n")[:-1]')

          echo "configs=$configs_json" >> $GITHUB_OUTPUT
          echo "Found $(echo "$all_configs" | wc -l) configurations to scan"

  scan-images:
    needs: discover-published-images
    runs-on: ubuntu-26.04
    if: ${{ needs.discover-published-images.outputs.configs != '[]' }}
    strategy:
      matrix:
        config: ${{ fromJson(needs.discover-published-images.outputs.configs) }}
      fail-fast: false

    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write  # To create issues for critical findings

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yq
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1

      - name: Extract metadata from config
        id: meta
        env:
          CONFIG_FILE: ${{ matrix.config }}
        run: |
          config_file="$CONFIG_FILE"
          protocol=$(echo "$config_file" | cut -d'/' -f1)
          server_name=$(echo "$config_file" | cut -d'/' -f2)

          echo "protocol=$protocol" >> $GITHUB_OUTPUT
          echo "server_name=$server_name" >> $GITHUB_OUTPUT

          # Extract version
          spec_version=$(yq '.spec.version' "$config_file" 2>/dev/null || echo "")
          if [ -n "$spec_version" ]; then
            version="$spec_version"
          else
            version="latest"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

          # Generate image name
          image_name="${REGISTRY}/${IMAGE_NAME}/${protocol}/${server_name}"
          echo "image_name=$image_name" >> $GITHUB_OUTPUT
          echo "image_ref=${image_name}:${version}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SARIF feed exists for visibility in the Security tab, so it stays
      # broad on purpose: every severity, including findings with no fix
      # available. Narrowing it would silently drop existing coverage. Note
      # severity-cutoff only feeds grype's --fail-on and does not filter the
      # report, so with fail-build disabled it has no effect here; only-fixed is
      # what would filter, and it is deliberately absent.
      - name: Run Grype vulnerability scan (SARIF)
        id: grype-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "${{ steps.meta.outputs.image_ref }}"
          fail-build: "false"
          output-format: "sarif"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: 'periodic-grype-${{ steps.meta.outputs.server_name }}'

      - name: Run Grype vulnerability scan (JSON)
        id: grype-scan-json
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "${{ steps.meta.outputs.image_ref }}"
          severity-cutoff: "high"
          only-fixed: "true"
          fail-build: "false"
          output-format: "json"

      - name: Check for critical or high issues
        id: check-critical
        run: |
          critical=$(jq '[.matches[]? | select(.vulnerability.severity == "Critical")] | length' ${{ steps.grype-scan-json.outputs.json }})
          high=$(jq '[.matches[]? | select(.vulnerability.severity == "High")] | length' ${{ steps.grype-scan-json.outputs.json }})

          echo "critical=$critical" >> $GITHUB_OUTPUT
          echo "high=$high" >> $GITHUB_OUTPUT

          # Match the publish gate in build-containers.yml: any fixable
          # critical or high finding is enough to block a release, so it is
          # also enough to warrant an issue.
          if [ "$((critical + high))" -gt 0 ]; then
            echo "should_create_issue=true" >> $GITHUB_OUTPUT
          else
            echo "should_create_issue=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for critical or high findings
        if: steps.check-critical.outputs.should_create_issue == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GRYPE_JSON_PATH: ${{ steps.grype-scan-json.outputs.json }}
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync(process.env.GRYPE_JSON_PATH, 'utf8'));

            const critical = ${{ steps.check-critical.outputs.critical }};
            const high = ${{ steps.check-critical.outputs.high }};

            let body = `## 🚨 Security Scan Alert\n\n`;
            body += `A periodic security scan found fixable critical or high severity vulnerabilities in the container image. Findings at this level also block publishing in the build workflow.\n\n`;
            body += `- **Image**: \`${{ steps.meta.outputs.image_ref }}\`\n`;
            body += `- **Critical vulnerabilities**: ${critical}\n`;
            body += `- **High vulnerabilities**: ${high}\n\n`;

            body += `### Details\n\n`;
            body += `See the [Security tab](../../security/code-scanning) for full details.\n\n`;

            if (critical > 0) {
              body += `#### Critical Vulnerabilities\n\n`;
              const criticalVulns = (results.matches || [])
                .filter(m => m.vulnerability.severity === 'Critical')
                .slice(0, 5);

              for (const match of criticalVulns) {
                body += `- **${match.vulnerability.id}** in \`${match.artifact.name}@${match.artifact.version}\`: ${match.vulnerability.description || 'No description'}\n`;
              }

              if (critical > 5) {
                body += `\n_... and ${critical - 5} more. See Security tab for complete list._\n`;
              }
            }

            if (high > 0) {
              body += `#### High Vulnerabilities\n\n`;
              const highVulns = (results.matches || [])
                .filter(m => m.vulnerability.severity === 'High')
                .slice(0, 5);

              for (const match of highVulns) {
                body += `- **${match.vulnerability.id}** in \`${match.artifact.name}@${match.artifact.version}\`: ${match.vulnerability.description || 'No description'}\n`;
              }

              if (high > 5) {
                body += `\n_... and ${high - 5} more. See Security tab for complete list._\n`;
              }
            }

            body += `\n---\n`;
            body += `_Automated security scan from [periodic-security-scan workflow](../actions/workflows/periodic-security-scan.yml)_`;

            // Label by what was actually found, so a high-only issue is not
            // labelled critical. security+grype are always applied and are what
            // the dedup query below matches on.
            const labels = ['security', 'grype'];
            if (critical > 0) labels.push('critical');
            if (high > 0) labels.push('high');

            // Check if an issue already exists for this image. Paginate, since
            // there can be more open scan issues than fit on one page, and
            // match the exact title so one server's name cannot match another's.
            const title = `🚨 Security: Critical or high vulnerabilities in ${{ steps.meta.outputs.server_name }} container`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,grype',
              per_page: 100,
            });

            const existingIssue = issues.find(issue => issue.title === title);

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## Updated Scan Results\n\n${body}`
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels
              });
              console.log('Created new security issue');
            }

      # Only reached when the scan steps above succeeded (no always()), so a
      # missing image or a Grype error is never mistaken for a clean result.
      - name: Close resolved security issue
        if: steps.check-critical.outputs.should_create_issue == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SERVER_NAME: ${{ steps.meta.outputs.server_name }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        with:
          script: |
            const title = `🚨 Security: Critical or high vulnerabilities in ${process.env.SERVER_NAME} container`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,grype',
              per_page: 100,
            });

            const resolved = issues.filter(issue => issue.title === title);
            for (const issue of resolved) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The periodic scan of \`${process.env.IMAGE_REF}\` found no fixable critical or high vulnerabilities, so this issue is being closed. It will be reopened as a new issue if findings return.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Closed resolved issue #${issue.number}`);
            }

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: periodic-scan-${{ steps.meta.outputs.server_name }}
          path: |
            ${{ steps.grype-scan-json.outputs.json }}
            ${{ steps.grype-scan.outputs.sarif }}
          retention-days: 90

  summary:
    needs: scan-images
    runs-on: ubuntu-26.04
    permissions: {}
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Periodic Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Type**: Vulnerability scan (Grype)" >> $GITHUB_STEP_SUMMARY
          echo "- **Severity Levels**: CRITICAL, HIGH (fixable only, matching the publish gate)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.scan-images.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the [Security tab](../../security/code-scanning)." >> $GITHUB_STEP_SUMMARY
