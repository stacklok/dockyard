metadata:
  name: hashicorp-terraform-policy
  description: 'Write, test, or convert Terraform Policy files (.policy.hcl, .policytest.hcl, Sentinel→tfpolicy).
    Triggers: policy.hcl, policytest, convert sentinel, tfpolicy, write a policy.'

spec:
  repository: "https://github.com/hashicorp/agent-skills"
  ref: "6333093c37a318cb800d57a6de7d0877a9e048a4"  # main as of 2026-08-10
  path: "plugins/terraform/skills/terraform-policy"
  version: "0.1.0"

provenance:
  repository_uri: "https://github.com/hashicorp/agent-skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: ATR_2026_00001
      reason: "FP: matched imperative-sounding doc prose (e.g. SKILL.md:12) describing Terraform/Packer usage guidance, not an injected directive to the agent."
    - rule_id: ATR_2026_00012
      reason: "FP: matched code-example tokens (e.g. references/tfpolicy-author.md:275, references/tfpolicy-author.md:713) in Go/HCL/API code snippets or shell examples — legitimate example code, not a hidden execution primitive."
    - rule_id: ATR_2026_00013
      reason: "FP: matched example IP addresses or `internal/` package paths in Terraform configuration/code examples (e.g. references/tfpolicy-author.md:1449, references/tfpolicy-author.md:1459) — standard placeholder addressing or Go module layout, not exfiltration to an internal network."
    - rule_id: ATR_2026_00032
      reason: "FP: matched comparative \"instead of ...\" phrasing in documentation prose (e.g. references/verified-syntax.md:1593), not an override instruction."
    - rule_id: ATR_2026_00040
      reason: "FP: matched the literal string `\"root\"` in an example policy/config value (e.g. references/tfpolicy-author.md:415), not a privilege-escalation instruction."
    - rule_id: ATR_2026_00051
      reason: "FP: matched \"every item\"/\"all files\"/\"all table\" describing bulk Terraform operations such as import or code generation in documentation (e.g. references/tfpolicy-author.md:595, references/tfpolicy-author.md:604), not a bulk-exfiltration action."
    - rule_id: ATR_2026_00062
      reason: "FP: matched placeholder tokens like `_SECRET_`/`__generated__`/`_secret_` used as example variable or env-var names in documentation (e.g. references/tfpolicy-author.md:1527, references/tfpolicy-author.md:1531), not real secrets."
    - rule_id: ATR_2026_00063
      reason: "FP: matched words like \"exfil\"/\"upload\"/\"encrypt\" in documentation prose — either warning against exfiltration (design-principles guidance) or describing legitimate upload/encryption features (HCP Packer registry push, state upload, disk encryption) (e.g. SKILL.md:26, references/tfpolicy-author.md:18), not exfiltration code."
    - rule_id: ATR_2026_00066
      reason: "FP: matched Terraform HCL string-interpolation syntax (`${...}`) or GitHub Actions `secrets.*` references in documented configuration/CI examples (e.g. references/tfpolicy-author.md:131, references/tfpolicy-author.md:147) — standard HCL/CI syntax, not injected secrets."
    - rule_id: ATR_2026_00083
      reason: "FP: matched \"override\" describing Terraform variable/precedence override semantics in documentation prose (e.g. references/tfpolicy-test.md:140, references/tfpolicy-test.md:765)."
    - rule_id: ATR_2026_00084
      reason: "FP: matched \"override\" describing Terraform variable/precedence override semantics in documentation prose (e.g. references/tfpolicy-test.md:860, references/tfpolicy-test.md:1870)."
    - rule_id: ATR_2026_00085
      reason: "FP: matched \"skip the identity check\"/\"skip it\" describing a documented configuration opt-out (e.g. references/tfpolicy-author.md:641, references/tfpolicy-author.md:1431), not an instruction to silently bypass security."
    - rule_id: ATR_2026_00140
      reason: "FP: matched the word \"reverse\"/\"opposite\" in comparative documentation prose (e.g. references/tfpolicy-author.md:357, references/verified-syntax.md:139)."
    - rule_id: PG_PII_SSN_HARVESTING
      reason: "FP: matched \"ask missing\" phrasing in policy-authoring documentation (e.g. references/tfpolicy-author.md:710, references/verified-syntax.md:845), not SSN collection."
