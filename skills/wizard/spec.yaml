# Matt Pocock wizard Skill
# Generate an interactive bash wizard for manual procedures.
# Source: https://github.com/mattpocock/skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/wizard:0.1.0

metadata:
  name: wizard
  description: "Generate an interactive bash wizard that walks a human through a manual procedure — third-party setup, a one-off migration, an A→B state transition — opening URLs, capturing values, confirming each step, and writing .env files and GitHub Actions secrets."

spec:
  repository: "https://github.com/mattpocock/skills"
  ref: "068b6e0c62393147daf03530149cdce209c93da8"  # main as of 2026-08-06
  path: "skills/engineering/wizard"
  version: "0.2.2"

provenance:
  repository_uri: "https://github.com/mattpocock/skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "mattpocock/skills is licensed MIT at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    - rule_id: ATR_2026_00063
      reason: "FP: scanner pattern-matches the literal string '.env' in SKILL.md prose describing the wizard's documented purpose - writing .env files during a human-run setup procedure - not a credential leak."
    - rule_id: ATR_2026_01610
      reason: "FP: 'bash -n <script>' is the standard non-executing syntax-check flag, used in the skill's own verification step before handing a generated script to the human."
    - rule_id: ATR_2026_00064
      reason: "FP: 'chmod +x' makes the skill's generated wizard script executable for the human to run, as documented in the hand-off step; not a privilege-escalation payload."
