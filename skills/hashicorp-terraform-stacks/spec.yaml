# HashiCorp hashicorp-terraform-stacks Skill
# Source: https://github.com/hashicorp/agent-skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/hashicorp-terraform-stacks:0.1.0

metadata:
  name: hashicorp-terraform-stacks
  description: Comprehensive guide for working with HashiCorp Terraform Stacks. Use when creating, modifying,
    or validating Terraform Stack configurations (.tfcomponent.hcl, .tfdeploy.hcl files), working with stack
    components and deployments from local modules, public registry, or private registry sources, managing
    multi-region or multi-environment infrastructure, or troubleshooting Terraform Stacks syntax and structure.

spec:
  repository: "https://github.com/hashicorp/agent-skills"
  ref: "6333093c37a318cb800d57a6de7d0877a9e048a4"  # main as of 2026-08-10
  path: "plugins/terraform/skills/terraform-stacks"
  version: "0.1.0"

provenance:
  repository_uri: "https://github.com/hashicorp/agent-skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "hashicorp/agent-skills is licensed MPL-2.0 at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    - rule_id: ATR_2026_00012
      reason: "FP: matched code-example tokens (e.g. references/api-monitoring.md:39, references/api-monitoring.md:47) in Go/HCL/API code snippets or shell examples — legitimate example code, not a hidden execution primitive."
    - rule_id: ATR_2026_00013
      reason: "FP: matched example IP addresses or `internal/` package paths in Terraform configuration/code examples (e.g. references/deployment-blocks.md:97, references/deployment-blocks.md:178) — standard placeholder addressing or Go module layout, not exfiltration to an internal network."
    - rule_id: ATR_2026_00021
      reason: "FP: matched the literal attribute name `password` in a Terraform schema or example (e.g. references/examples.md:260, references/examples.md:347) — naming a sensitive field in example code, not a leaked credential."
    - rule_id: ATR_2026_00030
      reason: "FP: matched prose describing Terraform's apply confirmation flow (e.g. references/troubleshooting.md:179) — documentation about requiring human approval, not skipping it."
    - rule_id: ATR_2026_00051
      reason: "FP: matched \"every item\"/\"all files\"/\"all table\" describing bulk Terraform operations such as import or code generation in documentation (e.g. SKILL.md:23, references/linked-stacks.md:187), not a bulk-exfiltration action."
    - rule_id: ATR_2026_00063
      reason: "FP: matched words like \"exfil\"/\"upload\"/\"encrypt\" in documentation prose — either warning against exfiltration (design-principles guidance) or describing legitimate upload/encryption features (HCP Packer registry push, state upload, disk encryption) (e.g. SKILL.md:296, SKILL.md:371), not exfiltration code."
    - rule_id: ATR_2026_00066
      reason: "FP: matched Terraform HCL string-interpolation syntax (`${...}`) or GitHub Actions `secrets.*` references in documented configuration/CI examples (e.g. SKILL.md:211, SKILL.md:308) — standard HCL/CI syntax, not injected secrets."
    - rule_id: ATR_2026_00090
      reason: "FP: matched \"Extract API Token from Credential...\" heading describing how a user's own monitoring pipeline reads its own token (e.g. references/api-monitoring.md:29), documentation prose."
    - rule_id: ATR_2026_00111
      reason: "FP: matched `curl -L` used to download the official HashiCorp/vendor CLI release binary (e.g. SKILL.md:425, references/api-monitoring.md:332) — a documented, vendor-published install step."
    - rule_id: ATR_2026_00113
      reason: "FP: matched documented credential-chain/identity-token setup instructions (AWS/Azure/GCP dynamic credentials, `~/.aws/credentials` path) (e.g. SKILL.md:146, references/deployment-blocks.md:59) — standard provider authentication guidance."
    - rule_id: PG_PII_CREDENTIAL_HARVESTING
      reason: "FP: matched documentation describing the user's own cloud credential storage in Terraform Cloud varsets or CI secrets (e.g. SKILL.md:255, references/api-monitoring.md:29) — configuration guidance, not credential harvesting."
    - rule_id: PG_PII_CREDIT_CARD
      reason: "FP: matched an illustrative example number formatted like a credit card in documentation (e.g. references/examples.md:1093), not a real leaked card number."
