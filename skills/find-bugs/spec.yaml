# Sentry find-bugs Skill
# Bug, vulnerability, and code-quality review across local branch changes.
# Source: https://github.com/getsentry/skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/find-bugs:0.1.0

metadata:
  name: find-bugs
  description: "Find bugs, security vulnerabilities, and quality issues on the current branch — diff-scoped review with security checklist covering injection, XSS, auth, IDOR, race conditions, and business-logic edge cases"

spec:
  repository: "https://github.com/getsentry/skills"
  ref: "6abccd60c704f669423d6a06ff0809fa39513ce8"  # main as of 2026-04-20
  path: "skills/find-bugs"
  version: "0.2.2"

provenance:
  repository_uri: "https://github.com/getsentry/skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "getsentry/skills is licensed Apache-2.0 at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    - rule_id: ATR_MCP_MALICIOUS_RESPONSE
      reason: |
        False positive - the skill's instructions include the literal command
        `git diff $(gh repo view --json defaultBranchRef --jq '.defaultBranchRef.name')...HEAD`
        as a documented step for diff-scoping a code review. ATR_MCP_MALICIOUS_RESPONSE
        is intended to flag shell commands embedded in MCP *tool responses*; here
        the command is hard-coded skill content (not attacker-controlled) and uses
        only read-only tools (`git diff`, `gh repo view`). Verified at digest
        5cfc9e22a91c2d3a230c4d5154ea0f1babce3b28.
    - rule_id: ATR_2026_00010
      reason: |
        False positive (tool_poisoning) - matches the same hard-coded diff-scoping
        command already justified above (previously flagged as
        ATR_MCP_MALICIOUS_RESPONSE): `git diff $(gh repo view --json
        defaultBranchRef --jq '.defaultBranchRef.name')...HEAD`. This is
        documented skill content, not attacker-controlled tool output, and uses
        only read-only commands (git diff, gh repo view). The scanner appears to
        have renumbered this rule between scans.
    - rule_id: ATR_2026_00040
      reason: "False positive (privilege_escalation) - matches the English word 'truncate' in 'If output is truncated, read each changed file individually until you have seen every changed line' (SKILL.md), describing terminal output truncation, not evidence/log tampering."
    - rule_id: ATR_2026_00051
      reason: "False positive (excessive_autonomy) - matches ordinary quantifier words ('all files', 'All database', 'EVERY item', 'Unbounded operations', 'every file') inside a read-only security-review checklist enumerating what to inspect (attack surface mapping and a DoS checklist item literally named 'Unbounded operations'), not instructions granting the agent broad destructive authority."
