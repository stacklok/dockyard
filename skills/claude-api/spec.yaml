    - rule_id: BEHAVIOR_CROSSFILE_ENV_VAR_EXFILTRATION
      reason: "FP: shared/preserved-thinking-migration/drop_block_probe.py reads ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN and sends it only to the Anthropic Messages API (ANTHROPIC_BASE_URL, default https://api.anthropic.com), the SDK-standard way to authenticate. Live requests require an explicit --yes. prefix_diff.py is its local request-diff helper."
    - rule_id: BEHAVIOR_CROSSFILE_EXFILTRATION_CHAIN
      reason: "FP: same flow as BEHAVIOR_CROSSFILE_ENV_VAR_EXFILTRATION. drop_block_probe.py and prefix_diff.py in shared/preserved-thinking-migration/ read local request captures and send probe requests to the Anthropic Messages API with the user's own credential."
