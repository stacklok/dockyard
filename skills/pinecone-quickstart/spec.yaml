# Pinecone pinecone-quickstart Skill
# Interactive quickstart for new Pinecone developers.
# Depends on: Pinecone MCP server (packaged in toolhive-catalog).
# Source: https://github.com/pinecone-io/skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/pinecone-quickstart:0.1.0

metadata:
  name: pinecone-quickstart
  description: "Interactive Pinecone quickstart — two paths: Database (create integrated index, upsert sample data, semantic search via Pinecone MCP + Python) or Assistant (document Q&A via Pinecone Assistant)"

spec:
  repository: "https://github.com/pinecone-io/skills"
  ref: "34f25f3eb4fd0fe1e2da6c6c4cfe84bb0c6a7273"  # main as of 2026-03-11
  path: "skills/pinecone-quickstart"
  version: "0.3.0"

provenance:
  repository_uri: "https://github.com/pinecone-io/skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: PG_PII_CREDENTIAL_HARVESTING
      reason: "FP: SKILL.md:108 is prose describing the five sample documents the quickstart upserts (a refund policy, an error log, a password reset, an order). 'password reset' is the topic of a sample support document; the skill never requests or collects credentials. Verified at digest 34f25f3eb4fd0fe1e2da6c6c4cfe84bb0c6a7273."
    - rule_id: RESOURCE_ABUSE_INFINITE_LOOP
      reason: "FP: scripts/upsert.py:69 is a bounded polling loop in wait_until_searchable(). It returns once the document is searchable or once a time.monotonic() deadline (60s default) passes, sleeping 2s between polls. Verified at digest 34f25f3eb4fd0fe1e2da6c6c4cfe84bb0c6a7273."
