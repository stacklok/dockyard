metadata:
  name: figma-swiftui
  description: SwiftUI ↔ Figma translation. Use whenever the user mentions Swift, SwiftUI, iOS, iPhone,
    or iPad — in EITHER direction — translating a Figma design into SwiftUI (design → code), or pushing
    SwiftUI views / screens / tokens back into a Figma file (code → design). Triggers on phrases like 'implement
    this Figma design in SwiftUI', 'build this screen in Swift', 'push this SwiftUI view to Figma', 'mirror
    my Swift code in a Figma file', or whenever a Figma URL appears alongside `.swift` files / an `.xcodeproj`.
    Routes to a direction-specific reference doc; loads alongside `figma-use` for the code → design path.

