metadata:
  name: agent-observability-eval-bootstrap
  description: "Bootstrap LLM evaluation sessions in Datadog LLM Observability — set up datasets, metrics, and baseline comparisons for prompt or model changes"

spec:
  repository: "https://github.com/datadog-labs/agent-skills"
  ref: "5b40c73824ec2a16fd98ab19b6c2ecdb08c1a17e"
  path: "agent-observability/agent-observability-eval-bootstrap"
  version: "0.5.0"

provenance:
  repository_uri: "https://github.com/datadog-labs/agent-skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: PG_EXFIL_MARKDOWN_LINK
      reason: |
        False positive - the flagged pattern is a markdown link template
        `[Trace {first_8}...](https://app.datadoghq.com/llm/traces?query=trace_id:{full_32_char_id})`
        used by the skill to cite trace evidence to the USER. The destination
        (app.datadoghq.com) is the user's own Datadog SaaS tenant; the encoded
        value is a trace_id surfaced from the user's own LLM Observability data
        — not exfiltrated agent context. The link is rendered for the user to
        click and verify the cited trace, which is the explicit purpose stated
        in the "Show your work" operating rule. Verified at digest
        98343f304cbd4439b3d7640cfe64f78070e44d68 (SKILL.md:681).
    - rule_id: PG_PII_SSN_HARVESTING
      reason: "FP: matched 'prompt template, parsin' in evaluation prompt template documentation — refers to parsing prompt templates for LLM evaluation, not PII harvesting."
