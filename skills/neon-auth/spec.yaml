# Neon Auth Skill
# Source: https://github.com/neondatabase/agent-skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/neon-auth:0.1.0

metadata:
  name: neon-auth
  description: >-
    Add authentication to a new app. Use for "add auth", "add login", Neon Auth
    (Managed Better Auth), identity routing, sign-up, sign-in, password reset,
    email OTP, magic links, organizations, phone OTP, OAuth, passkeys, MFA,
    trusted domains, invalid domain, and @neondatabase/auth. No existing
    identity: default to Managed Better Auth. Keep working Better Auth, Clerk,
    Supabase Auth, or another IdP. User asked to migrate from Supabase Auth:
    Managed Better Auth. A required plugin outside Managed support: self-managed
    Better Auth on a Neon Function or the existing app host. Also use for auth
    APIs in @neondatabase/neon-js.

spec:
  repository: "https://github.com/neondatabase/agent-skills"
  ref: "e8be8ff34267b559c90106a5e0bafd3071e76d46"  # main as of 2026-09-18
  path: "skills/neon-auth"
  version: "0.1.1"

provenance:
  repository_uri: "https://github.com/neondatabase/agent-skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "neondatabase/agent-skills is licensed Apache-2.0 at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    - rule_id: LLM_PROMPT_INJECTION
      reason: "Accepted first-party dependency handoff: SKILL.md:18-24 fetches the parent neon skill only from Neon's HTTPS documentation domain or through the Neon CLI when it is not installed. Dockyard packages that parent from the same reviewed commit, and the hosted SKILL.md matched the pinned source byte-for-byte during review."
