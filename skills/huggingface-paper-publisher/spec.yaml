# Hugging Face huggingface-paper-publisher Skill
# Publish and manage research papers on Hugging Face Hub.
# Source: https://github.com/huggingface/skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/huggingface-paper-publisher:0.1.0

metadata:
  name: huggingface-paper-publisher
  description: "Publish and manage research papers on Hugging Face Hub — create paper pages, link papers to models/datasets/spaces, claim authorship, generate markdown research articles, manage citations and visibility"

spec:
  repository: "https://github.com/huggingface/skills"
  ref: "ec0108293521ef698e451ec044e8b4feba6b732b"  # main as of 2026-04-16
  path: "skills/huggingface-paper-publisher"
  version: "0.3.0"

provenance:
  repository_uri: "https://github.com/huggingface/skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "huggingface/skills is licensed Apache-2.0 at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    - rule_id: ATR_2026_00111
      reason: "FP: cisco-ai-skill-scanner pattern-matched shell command-substitution fragments `$(cat citation.txt)` (SKILL.md:118) and `$(cat abstract.txt)` (SKILL.md:196) in documented CLI examples that read local user-authored paper text into a command; no untrusted input and no host command injection. huggingface/skills @35810a6dbe518a0f7bd99b1e6550cb57b266ff0b."
    - rule_id: DATA_EXFIL_NETWORK_REQUESTS
      reason: "`scripts/paper_manager.py` uses `requests.get()` to query the public Hugging Face Hub API (`api.huggingface.co`) for paper metadata — the skill's entire purpose. The destinations are the official HF API endpoints documented in the SKILL.md workflow."
    - rule_id: TOOL_ABUSE_UNDECLARED_NETWORK
      reason: "The skill uses network access through its bundled `paper_manager.py` script (as its documented workflow), but does not declare an explicit network-access tool in frontmatter. All network calls target the public Hugging Face Hub API documented in the SKILL.md."
    - rule_id: FILE_MAGIC_MISMATCH
      reason: "`templates/modern.md` is a paper template that legitimately uses Handlebars-style `{{}}` substitution syntax. Magika detects the Handlebars markers and flags the format mismatch; the file is plain text documentation and safe."
    - rule_id: BEHAVIOR_ENV_VAR_EXFILTRATION
      reason: |
        False positive - matches `scripts/paper_manager.py` reading `HF_TOKEN`
        (line 44) and making `requests.get()` calls to
        `https://huggingface.co/papers/{arxiv_id}` (lines 69, 98, 179, 215) and
        `https://export.arxiv.org/api/query` (line 352, no token sent). This
        is the standard, intended HF API auth pattern — token issued by
        huggingface.co is sent back to huggingface.co. Source domain == sink
        domain. Verified at digest acd2bf5a7126994e15143bec061fe87a882811f3.
    - rule_id: BEHAVIOR_CROSSFILE_ENV_VAR_EXFILTRATION
      reason: |
        False positive - same root cause as BEHAVIOR_ENV_VAR_EXFILTRATION
        above. The "crossfile" detection is from `paper_manager.py` reading
        env vars and triggering its own network helpers within the same file/
        module. All network destinations are huggingface.co or
        export.arxiv.org. Verified at digest
        acd2bf5a7126994e15143bec061fe87a882811f3.
    - rule_id: ATR_2026_01610
      reason: "FP: renumbered successor of the ATR_2026_00111 finding above - same `$(cat citation.txt)` (SKILL.md:118) / `$(cat abstract.txt)` (SKILL.md:196) command-substitution fragments reading local user-authored paper text; no untrusted input, no host command injection."
    - rule_id: LLM_COMMAND_INJECTION
      reason: "Same root cause as the allowlisted ATR_2026_00111/ATR_2026_01610 findings: `$(cat citation.txt)` / `$(cat abstract.txt)` read local files the user authored themselves as CLI arguments to the bundled paper_manager.py script; not attacker-controlled input."
    - rule_id: LLM_SUPPLY_CHAIN_ATTACK
      reason: "SKILL.md documents its bundled script's Python dependencies with minimum-version (>=) constraints (huggingface_hub, pyyaml, requests, markdown, python-dotenv) in an informational 'Dependencies' list read by a human setting up the script locally; Dockyard does not execute or resolve this list at packaging or run time, so it isn't an exploitable install path here. Accepted as inherent to how this vendored skill documents its own script's requirements."
