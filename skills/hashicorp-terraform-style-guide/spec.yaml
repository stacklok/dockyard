# Will publish as: ghcr.io/stacklok/dockyard/skills/hashicorp-terraform-style-guide:0.1.0

metadata:
  name: hashicorp-terraform-style-guide
  description: Generate Terraform HCL code following HashiCorp's official style conventions and best practices.
    Use when writing, reviewing, or generating Terraform configurations.

spec:
  repository: "https://github.com/hashicorp/agent-skills"
  ref: "326846817128fd1d052d25fbfded490ce2c5886e"  # main as of 2026-08-10
  path: "plugins/terraform/skills/terraform-style-guide"
  version: "0.2.0"

provenance:
  repository_uri: "https://github.com/hashicorp/agent-skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "hashicorp/agent-skills is licensed MPL-2.0 at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    - rule_id: ATR_2026_00063
      reason: "FP: matched words like \"exfil\"/\"upload\"/\"encrypt\" in documentation prose — either warning against exfiltration (design-principles guidance) or describing legitimate upload/encryption features (HCP Packer registry push, state upload, disk encryption) (e.g. SKILL.md:220), not exfiltration code."
    - rule_id: ATR_2026_00066
      reason: "FP: matched Terraform HCL string-interpolation syntax (`${...}`) or GitHub Actions `secrets.*` references in documented configuration/CI examples (e.g. SKILL.md:68, SKILL.md:192) — standard HCL/CI syntax, not injected secrets."
