# Matt Pocock improve-codebase-architecture Skill
# Find deepening opportunities in a codebase using domain language and ADR decisions.
# Source: https://github.com/mattpocock/skills
# Will publish as: ghcr.io/stacklok/dockyard/skills/improve-codebase-architecture:0.1.0

metadata:
  name: improve-codebase-architecture
  description: "Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick."

spec:
  repository: "https://github.com/mattpocock/skills"
  ref: "068b6e0c62393147daf03530149cdce209c93da8"  # main as of 2026-08-06
  path: "skills/engineering/improve-codebase-architecture"
  version: "0.4.2"

provenance:
  repository_uri: "https://github.com/mattpocock/skills"
  repository_ref: "refs/heads/main"

security:
  allowed_issues:
    - rule_id: MANIFEST_MISSING_LICENSE
      reason: "mattpocock/skills is licensed MIT at the repository root; upstream does not embed an SPDX license identifier in per-skill SKILL.md frontmatter."
    # FP: PG_EXFIL_HTML_TAG pattern-matches the <script src="https://cdn.tailwindcss.com">
    # tag in HTML-REPORT.md's scaffold example. The file documents how to render the
    # architecture review as a static local HTML file; the only external references are
    # the official Tailwind and Mermaid CDNs and no user data is transmitted anywhere.
    - rule_id: PG_EXFIL_HTML_TAG
      reason: "FP: scanner matched the Tailwind CDN <script> tag in HTML-REPORT.md's static report scaffold; a script include from the official CDN in a local, self-contained report template, no data exfiltration."
    - rule_id: LLM_PROMPT_INJECTION
      reason: "Risk accepted by maintainer (danbarr, 2026-08-25): SKILL.md instructs the agent to read and incorporate CONTEXT.md and ADR files from docs/adr/ into its architectural analysis. These are project-local files the user already trusts and maintains; processing them is the skill's documented purpose (aligning suggestions with existing domain vocabulary and decisions). Same class of accepted risk as skills/hf-mcp and skills/huggingface-tool-builder."
    - rule_id: LLM_PROMPT_INJECTION
      reason: "Risk accepted by maintainer (danbarr, 2026-08-25): SKILL.md instructs the agent to run `git log --oneline` to find commit-history hot spots that guide where to focus analysis. Commit messages come from the project's own history, which the user already trusts; using them as a weighting signal is the skill's documented purpose, not processing of arbitrary external input."
